name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Claude PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install requests
          curl -sL -o claude-review.py https://raw.githubusercontent.com/bambooshadow-studio/claude-pr-review/main/claude-review.py
          python claude-review.py --pr "${{ github.event.pull_request.html_url }}"
