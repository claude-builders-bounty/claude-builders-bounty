general_settings:
  master_key: "sk-local-123"
  # 禁止自动获取远程模型价格表（避免超时、上下文长度被覆盖）
  disable_spend_logs: true
  disable_model_cost_map: true
  store_model_in_db: false

litellm_settings:
  # 关闭 litellm 自身重试，避免一次任务放大成多次请求；退避重试交给 Hermes 侧
  num_retries: 0

# 顶层 router_settings（proxy 会原样传给 Router 构造参数，不是嵌在 litellm_settings 下）
router_settings:
  # 显式开启“按部署强制 RPM/TPM 检查”，未开启时即使配了 rpm/tpm 也不拦截
  optional_pre_call_checks:
    - enforce_model_rate_limits

model_list:
  - model_name: nemotron-3-ultra
    litellm_params:
      model: nvidia/nemotron-3-ultra-550b-a55b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: "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"
      # 阈值读取位置（源码 _get_deployment_limits 确认）：litellm_params.rpm/tpm
      rpm: 20
      tpm: 80000
    model_info:
      max_tokens: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 8192
