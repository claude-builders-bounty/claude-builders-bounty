name: 'Claude PR Reviewer Agent'
description: 'Automated PR reviewer sub-agent for Claude Code analyzing diffs for risks, improvements, and confidence scores.'
inputs:
  pr_url:
    description: 'GitHub Pull Request URL'
    required: false
  diff_file:
    description: 'Path to local diff file'
    required: false
outputs:
  review_markdown:
    description: 'Structured Markdown PR review report'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Run Claude PR Reviewer
      shell: bash
      run: |
        python src/claude_review.py --pr "${{ github.event.pull_request.html_url }}" --output pr_review.md
        cat pr_review.md
