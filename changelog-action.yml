# GitHub Actions workflow for automatic CHANGELOG generation
# Place this file at: .github/workflows/changelog.yml
#
# Triggers on every push to main/master and generates an updated CHANGELOG.
# Can also be triggered manually via workflow_dispatch.

name: Generate CHANGELOG

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      format:
        description: 'Output format (md or json)'
        required: false
        default: 'md'
        type: choice
        options:
          - md
          - json

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for changelog generation

      - name: Make changelog script executable
        run: chmod +x changelog.sh

      - name: Generate CHANGELOG (Markdown)
        run: |
          FORMAT="${{ github.event.inputs.format || 'md' }}"
          if [ "$FORMAT" = "json" ]; then
            ./changelog.sh --format=json CHANGELOG.json
          else
            ./changelog.sh CHANGELOG.md
          fi

      - name: Commit and push CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md CHANGELOG.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-update CHANGELOG [skip ci]"
            git push
          fi
