name: 'Claude PR Reviewer'
description: 'An autonomous agent that analyzes PR diffs and posts structured markdown reviews using Claude.'
author: 'ZachDreamZ'

inputs:
  github_token:
    description: 'GitHub token for posting comments'
    required: true
    default: ${{ github.token }}
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  model:
    description: 'Claude model to use'
    required: false
    default: 'claude-3-7-sonnet-20250219'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install -U pip
        pip install requests anthropic
        
    - name: Run Claude Review Agent
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        CLAUDE_MODEL: ${{ inputs.model }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python ${{ github.action_path }}/review.py
