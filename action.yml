name: 'Aletheia PR Reviewer Agent'
description: 'Audits Pull Request diffs using the Gemini API and posts a structured review.'
author: 'Aletheia AI'
branding:
  icon: 'eye'
  color: 'green'

inputs:
  pr_url:
    description: 'The full URL of the Pull Request to review'
    required: false
    default: '${{ github.event.pull_request.html_url }}'
  gemini_api_key:
    description: 'Gemini API Key for the code analysis'
    required: true
  github_token:
    description: 'GitHub token to fetch the PR diff and post the review comment'
    required: true
  model:
    description: 'Gemini model to use (e.g. gemini-1.5-flash)'
    required: false
    default: 'gemini-2.5-flash'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Reviewer CLI
      shell: bash
      run: pip install .
      
    - name: Run PR Review
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        claude-review --pr "${{ inputs.pr_url }}" --model "${{ inputs.model }}"
