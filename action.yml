name: 'Claude Code PR Review'
description: 'Posts a structured code review comment on a pull request'
author: 'Claude Builders Bounty'
inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  pr-number:
    description: 'Pull request number to review'
    required: true
  owner:
    description: 'Repository owner'
    required: true
  repo:
    description: 'Repository name'
    required: true
runs:
  using: 'node12'
  main: 'claude-review'
  args:
    - '--token'
    - ${{ inputs.github-token }}
    - '--pr'
    - https://github.com/${{ inputs.owner }}/${{ inputs.repo }}/pull/${{ inputs.pr-number }}