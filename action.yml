name: 'Claude PR Review'
description: 'AI-powered PR reviews using Claude Sonnet 4.6'
author: 'Claude Builders Community'

branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  anthropic-api-key:
    description: 'Anthropic API key for Claude'
    required: true
  pr-url:
    description: 'PR URL to review (auto-detected if not provided)'
    required: false
  post-comment:
    description: 'Post review as PR comment'
    required: false
    default: 'true'
  output-file:
    description: 'Save review to file'
    required: false

outputs:
  review:
    description: 'Generated review text'
  confidence:
    description: 'Confidence score (HIGH/MEDIUM/LOW)'
  verdict:
    description: 'Review verdict (APPROVE/COMMENT/REQUEST_CHANGES)'
  cost:
    description: 'Estimated cost in USD'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run PR Review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        # Detect PR URL if not provided
        if [ -z "${{ inputs.pr-url }}" ]; then
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_URL="${{ github.event.pull_request.html_url }}"
          else
            echo "❌ Error: pr-url input required for non-PR events"
            exit 1
          fi
        else
          PR_URL="${{ inputs.pr-url }}"
        fi

        echo "🔍 Reviewing PR: $PR_URL"

        # Run review
        python3 ${{ github.action_path }}/claude_pr_review.py \
          --pr "$PR_URL" \
          ${{ inputs.post-comment == 'true' && '--post' || '' }} \
          ${{ inputs.output-file && format('--output {0}', inputs.output-file) || '' }} \
          --show-cost

        echo "✅ Review complete"
