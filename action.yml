name: 'Claude PR Review'
description: 'AI-powered pull request review using Claude Code — posts a structured Markdown review comment on PRs'
author: 'claude-builders-bounty'

branding:
  icon: 'eye'
  color: 'purple'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  github_token:
    description: 'GitHub token for posting comments (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
  model:
    description: 'Claude model to use (e.g., claude-sonnet-4-20250514)'
    required: false
    default: ''
  post_comment:
    description: 'Whether to post the review as a PR comment'
    required: false
    default: 'true'

outputs:
  review:
    description: 'The generated review in Markdown format'
    value: ${{ steps.review.outputs.review }}

runs:
  using: 'composite'
  steps:
    - name: Install Claude Code CLI
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Run PR review
      id: review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        chmod +x "${{ github.action_path }}/claude-review"

        # Build CLI arguments
        ARGS="--pr ${{ github.event.pull_request.html_url }}"
        if [[ "${{ inputs.post_comment }}" == "true" ]]; then
          ARGS="$ARGS --post-comment"
        fi
        if [[ -n "${{ inputs.model }}" ]]; then
          ARGS="$ARGS --model ${{ inputs.model }}"
        fi

        # Run and capture output
        REVIEW=$("${{ github.action_path }}/claude-review" $ARGS)

        # Set output (handle multiline)
        {
          echo "review<<REVIEW_EOF"
          echo "$REVIEW"
          echo "REVIEW_EOF"
        } >> "$GITHUB_OUTPUT"
