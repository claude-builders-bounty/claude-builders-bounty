name: 'Claude PR Review'
description: 'Automated PR code review using Claude AI'
author: 'neo-sonicseeds'

inputs:
  pr-url:
    description: 'GitHub PR URL to review'
    required: true
  anthropic-api-key:
    description: 'Anthropic API key for Claude'
    required: true
  github-token:
    description: 'GitHub token for API access'
    required: false
    default: ${{ github.token }}

outputs:
  review:
    description: 'Generated review in Markdown format'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        pip install anthropic click

    - name: Run PR Review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python ${{ github.action_path }}/claude_review.py --pr "${{ inputs.pr-url }}"

branding:
  icon: 'check-circle'
  color: 'blue'