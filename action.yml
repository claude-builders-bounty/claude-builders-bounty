name: "Claude Code PR Reviewer"
description: "Autonomous Claude Code sub-agent that reviews pull requests and posts structured Markdown feedback."
author: "Claude Builders Community"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  pr-url:
    description: "GitHub Pull Request URL (defaults to current pull request)"
    required: false
    default: "${{ github.event.pull_request.html_url }}"
  github-token:
    description: "GitHub token for reading PR diffs and posting comments"
    required: false
    default: "${{ github.token }}"
  anthropic-api-key:
    description: "Anthropic API key for Claude 3.5 Sonnet analysis"
    required: false
  gemini-api-key:
    description: "Google Gemini API key for fallback inference"
    required: false
  provider:
    description: "LLM provider (auto, anthropic, gemini, openai, heuristic)"
    required: false
    default: "auto"
  model:
    description: "Model name override"
    required: false
    default: ""
  post-comment:
    description: "Whether to post review directly to PR thread ('true' or 'false')"
    required: false
    default: "true"

outputs:
  review-markdown:
    description: "The complete structured Markdown review comment generated by the agent"
    value: "${{ steps.run-review.outputs.review }}"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run Claude Review Agent
      id: run-review
      shell: bash
      env:
        GITHUB_TOKEN: "${{ inputs.github-token }}"
        ANTHROPIC_API_KEY: "${{ inputs.anthropic-api-key }}"
        GEMINI_API_KEY: "${{ inputs.gemini-api-key }}"
      run: |
        POST_FLAG=""
        if [ "${{ inputs.post-comment }}" = "true" ]; then
          POST_FLAG="--post"
        fi

        MODEL_FLAG=""
        if [ -n "${{ inputs.model }}" ]; then
          MODEL_FLAG="--model ${{ inputs.model }}"
        fi

        python3 "${{ github.action_path }}/bin/claude-review" \
          --pr "${{ inputs.pr-url }}" \
          --provider "${{ inputs.provider }}" \
          ${MODEL_FLAG} \
          ${POST_FLAG} \
          --output "$GITHUB_WORKSPACE/claude-review-output.md"

        # Export output to step
        {
          echo 'review<<EOF'
          cat "$GITHUB_WORKSPACE/claude-review-output.md"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
