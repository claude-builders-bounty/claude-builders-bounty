name: "Claude PR Reviewer"
description: "A GitHub Action that uses Claude to automatically review Pull Requests"
inputs:
  github_token:
    description: "GitHub Token for posting comments"
    required: true
  anthropic_api_key:
    description: "Anthropic API Key for Claude"
    required: true
  model:
    description: "Claude model to use"
    required: false
    default: "claude-3-5-sonnet-20241022"
runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      shell: bash
      run: |
        pip install requests PyGithub
        
    - name: Run Claude Reviewer
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ANTHROPIC_API_key: ${{ inputs.anthropic_api_key }}
      run: |
        PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
        python ${{ github.action_path }}/claude_reviewer.py --pr $PR_URL --api-key ${{ inputs.anthropic_api_key }} --post
