name: 'Claude Code PR Review'
description: 'Automated PR review using Claude Code — structured Markdown comments'
author: 'claude-review'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  github-token:
    description: 'GitHub token (automatically provided)'
    required: true
    default: ${{ github.token }}
  pr-number:
    description: 'PR number to review (defaults to the triggering PR)'
    required: false
    default: ${{ github.event.pull_request.number }}

runs:
  using: 'composite'
  steps:
    - name: Install Claude Code
      shell: bash
      run: |
        if ! command -v claude &> /dev/null; then
          npm install -g @anthropic-ai/claude-code
        fi

    - name: Setup claude-review
      shell: bash
      run: |
        curl -sL -o /tmp/claude-review \
          https://raw.githubusercontent.com/Andyyook/claude-builders-bounty/main/claude-review.py
        chmod +x /tmp/claude-review
        echo "alias claude-review=/tmp/claude-review" >> $GITHUB_ENV

    - name: Run review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        /tmp/claude-review --pr "${{ inputs.pr-number }}" \
          --repo "${{ github.repository }}" \
          --output review-output.md

    - name: Post comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh pr comment "${{ inputs.pr-number }}" \
          --body "$(cat review-output.md)" \
          --repo "${{ github.repository }}"
