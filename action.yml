name: 'Claude PR Reviewer Agent'
description: 'Analyze PR diffs and generate structured reviews using Claude'
author: 'adamsithr'
inputs:
  pr_url:
    description: 'The full URL of the Pull Request (e.g., https://github.com/owner/repo/pull/123)'
    required: true
  anthropic_api_key:
    description: 'Anthropic API Key to invoke Claude'
    required: true
  github_token:
    description: 'GitHub token to fetch PR diffs (especially for private repos)'
    required: false
    default: '${{ github.token }}'
runs:
  using: 'composite'
  steps:
    - name: Run Review Agent
      shell: bash
      run: python3 ${{ github.action_path }}/scripts/claude_review.py --pr "${{ inputs.pr_url }}"
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
