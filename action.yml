name: 'Claude Code PR Review'
description: 'AI-powered PR review agent that analyzes pull requests and posts structured comments'
author: 'feezy1357'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token'
    required: true
    default: ${{ github.token }}
  pr-number:
    description: 'Pull request number'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Review PR
      shell: bash
      run: |
        chmod +x ${{ github.action_path }}/claude-review.sh
        PR_URL="https://github.com/${{ github.repository }}/pull/${{ inputs.pr-number }}"
        GITHUB_TOKEN=${{ inputs.github-token }} ${{ github.action_path }}/claude-review.sh --pr "$PR_URL"
