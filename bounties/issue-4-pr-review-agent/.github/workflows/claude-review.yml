name: claude-review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install claude-review
        run: |
          mkdir -p .claude-review
          cp bounties/issue-4-pr-review-agent/claude-review.py .claude-review/review.py
          pip install -q pyyaml 2>/dev/null || true

      - name: Run review
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .claude-review/review.py \
            --pr ${{ github.repository }}/${{ github.event.pull_request.number }} \
            --output .claude-review/review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file .claude-review/review.md
