name: Test n8n Workflow Validator

on:
  push:
    paths:
      - "**.workflow.json"
  pull_request:
    paths:
      - "**.workflow.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate n8n workflow JSON
        run: |
          for f in $(find . -name "*.workflow.json"); do
            echo "Validating: $f"
            node "$(dirname "$f")/validate-workflow.mjs" || exit 1
          done
