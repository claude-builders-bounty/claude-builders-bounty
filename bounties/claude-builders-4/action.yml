name: 'Claude PR Review'
description: 'Reviews a PR diff with Claude Sonnet 4 and posts structured Markdown (Summary / Risks / Suggestions / Confidence)'
branding:
  icon: 'eye'
  color: 'purple'
inputs:
  pr_url:
    description: 'Full PR URL, e.g. https://github.com/owner/repo/pull/123'
    required: true
  anthropic_api_key:
    description: 'Anthropic API key (or set ANTHROPIC_API_KEY env)'
    required: true
  github_token:
    description: 'GitHub token for fetching the diff and posting a comment (defaults to github.token)'
    required: false
    default: '${{ github.token }}'
  model:
    description: 'Anthropic model'
    required: false
    default: 'claude-sonnet-4-20250514'
  post_comment:
    description: 'Post review as PR comment (true/false)'
    required: false
    default: 'true'
outputs:
  review:
    description: 'Markdown review body'
  confidence:
    description: 'Low / Medium / High'
runs:
  using: 'composite'
  steps:
    - name: Run claude-review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        node "${{ github.action_path }}/bin/claude-review.js" --pr "${{ inputs.pr_url }}" ${{ inputs.post_comment == 'true' && '--comment' || '' }}
