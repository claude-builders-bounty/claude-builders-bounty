name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'PR URL (e.g. https://github.com/owner/repo/pull/123)'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Claude PR review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ inputs.pr_url || github.event.pull_request.html_url }}"
          if [ -z "$PR_URL" ]; then
            echo "::error::No PR URL resolved (not a pull_request event and no pr_url input)"
            exit 1
          fi
          node bounties/claude-builders-4/bin/claude-review.js --pr "$PR_URL" --comment

      # Alternative — use as a reusable action:
      # - uses: ./bounties/claude-builders-4
      #   with:
      #     pr_url: ${{ github.event.pull_request.html_url }}
      #     anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
