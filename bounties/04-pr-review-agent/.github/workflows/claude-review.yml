# Optional GitHub Action: post structured review on PR open/sync.
# Requires secrets: none for heuristic mode. Optional ANTHROPIC_API_KEY.
name: Claude structured PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gh is preinstalled
        run: gh --version
      - name: Run structured review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          URL="${{ github.server_url }}/${{ github.repository }}/pull/${PR}"
          python bounties/04-pr-review-agent/claude_review.py --pr "$URL" > /tmp/review.md
          cat /tmp/review.md
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md
