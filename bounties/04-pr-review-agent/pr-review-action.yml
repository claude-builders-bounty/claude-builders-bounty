name: Claude PR Review
description: Run automated PR reviews with structured Markdown output
author: akuraposo

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install claude-review
        run: |
          curl -fsSL https://raw.githubusercontent.com/akuraposo/claude-builders-bounty/main/bounties/04-pr-review-agent/claude_review.py -o /tmp/claude_review.py
          chmod +x /tmp/claude_review.py
          python3 /tmp/claude_review.py --version || echo "claude-review installed"

      - name: Run PR review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 /tmp/claude_review.py \
            --pr "${{ github.event.pull_request.html_url }}" \
            --output /tmp/review.md

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: claude-review
          path: /tmp/review.md
