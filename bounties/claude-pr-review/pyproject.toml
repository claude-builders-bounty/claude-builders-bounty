[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pr-review-bounty"
version = "0.1.0"
description = "Read-only, structured Claude Code review of GitHub pull requests"
requires-python = ">=3.10"

[project.scripts]
claude-review = "claude_review:main"

[tool.setuptools]
py-modules = ["claude_review"]
