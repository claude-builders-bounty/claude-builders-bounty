name: PR Review Sub-Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Run PR Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python pr-review/claude-review --pr https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }} > review_output.md
          
      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: review_output.md
