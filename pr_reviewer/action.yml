name: 'Claude Code PR Reviewer'
description: 'AI-powered code review with structured Markdown output'
author: 'Claude Builders Bounty'

inputs:
  pr-url:
    description: 'GitHub PR URL'
    required: true

outputs:
  review:
    description: 'Structured Markdown review comment'
    value: ${{ steps.review.outputs.review }}

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        pip install requests
      shell: bash
    
    - name: Run PR Review
      id: review
      run: |
        python pr_reviewer/cli.py --pr ${{ inputs.pr-url }}
      shell: bash