# Configurable settings for pre-tool-use-hook.py
# Copy to ~/.claude/hooks/config.yaml and edit

allowlist:
  # Commands that contain these substrings are always allowed
  safe_commands:
    - "rm -rf node_modules"
    - "rm -rf .git"
    - "rm -rf __pycache__"
    - "rm -rf build"
    - "rm -rf dist"
    - "rm -rf .next"
    - "rm -rf venv"
    - "rm -rf .venv"
    - "truncate -s "
    - "DELETE FROM users WHERE"
    
  # Operations within these paths bypass destructive-path detection
  safe_path_prefixes:
    - "/tmp"
    - "/home"
    - "/var/www"
    - "/root"
    - "/opt"
    - "/usr/local"

logging:
  json_log: "blocked.json"
  human_log: "blocked.log"
  max_log_lines: 10000
