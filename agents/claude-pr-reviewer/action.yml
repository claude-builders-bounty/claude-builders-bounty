# GitHub Action: claude-pr-reviewer
# Drops a structured Markdown review as a PR comment when a PR is opened
# or synchronised.
name: 'Claude PR Review'
description: 'Auto-review the PR diff with Claude and post a structured Markdown comment.'
inputs:
  anthropic-api-key:
    description: 'Anthropic API key. Use secrets.ANTHROPIC_API_KEY by default.'
    required: false
    default: ${{ secrets.ANTHROPIC_API_KEY }}
  github-token:
    description: 'GitHub token used to post the comment. Use secrets.GITHUB_TOKEN.'
    required: false
    default: ${{ secrets.GITHUB_TOKEN }}
  model:
    description: 'Anthropic model name.'
    required: false
    default: 'claude-opus-4-7'
runs:
  using: 'composite'
  steps:
    - name: Install Python
      shell: bash
      run: |
        if ! command -v python3 >/dev/null; then
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
        fi
    - name: Run Claude review
      id: review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python3 agents/claude-pr-reviewer/claude_review.py \
          --pr "${{ github.event.pull_request.html_url }}" \
          --model "${{ inputs.model }}" \
          --anthropic-key "${{ inputs.anthropic-api-key }}" \
          --github-token "${{ inputs.github-token }}" \
          --out review.md
    - name: Post review as PR comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body-file review.md || true
branding:
  icon: 'check-circle'
  color: 'purple'
