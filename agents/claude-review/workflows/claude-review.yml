name: PR review draft
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use the trusted base commit of this reviewer repository, never PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Generate comment draft
        working-directory: agents/claude-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: python3 -m reviewer --pr "$PR_URL" --out review.md
      - uses: actions/upload-artifact@v4
        with:
          name: pr-review-draft
          path: review.md
