name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gh
        run: sudo apt-get update && sudo apt-get install -y gh
      - name: Run review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python agents/claude-review/claude-review.py --pr "${{ github.event.pull_request.html_url }}" > review.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file review.md