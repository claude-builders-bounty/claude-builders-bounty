name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download claude-review
        run: |
          curl -sL https://raw.githubusercontent.com/santozion17-afk/claude-builders-bounty/feature/claude-review-agent/agents/claude-review/claude-review.py -o claude-review.py
          chmod +x claude-review.py

      - name: Run Claude PR Review
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.number }}"
          python3 claude-review.py --pr "$PR_URL" --output review-output.md
          echo "REVIEW_FILE=review-output.md" >> "$GITHUB_OUTPUT"

      - name: Post Review as Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review-output.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: review
            });
