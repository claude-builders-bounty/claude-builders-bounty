name: "Claude PR Review"
description: "Automated PR review agent — analyzes PRs and posts structured reviews"
author: "OddXandre"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  gh-token:
    description: "GitHub token (defaults to GITHUB_TOKEN)"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Run review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
        ${{ github.action_path }}/claude-review --pr "$PR_URL"
