name: 'Claude PR Review'
description: 'Produce a structured Markdown PR review (Summary / Risks / Suggestions / Confidence)'
inputs:
  pr_url:
    description: 'Full GitHub pull request URL'
    required: true
  anthropic_api_key:
    description: 'Anthropic API key'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Run claude-review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ github.token }}
      run: |
        chmod +x "${{ github.action_path }}/claude-review"
        "${{ github.action_path }}/claude-review" --pr "${{ inputs.pr_url }}"
