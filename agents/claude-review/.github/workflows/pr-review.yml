name: PR Auto Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PR Review
        run: python claude-review.py --pr $REPO_URL --github-token ${{ secrets.GITHUB_TOKEN }}
        env:
          REPO_URL: ${{ github.event.pull_request.html_url }}
        working-directory: agents/claude-review/
