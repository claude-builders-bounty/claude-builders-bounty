name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: "PR URL to review"
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check required token
        run: |
          if [ -z "${{ github.token }}" ]; then
            echo "::error::GITHUB_TOKEN is unavailable. Enable default workflow permissions for pull requests."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run PR Review Agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url || inputs.pr_url }}
        run: |
          if [ -x ./claude-review ]; then
            ./claude-review --pr "$PR_URL" --post
          else
            python3 agents/claude-review/claude_review.py --pr "$PR_URL" --post
          fi
