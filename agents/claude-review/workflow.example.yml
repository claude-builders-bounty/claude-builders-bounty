# Copy to .github/workflows/claude-review.yml in a target repo
name: claude-review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout claude-review agent
        uses: actions/checkout@v4
        with:
          repository: claude-builders-bounty/claude-builders-bounty
          path: _agent
          sparse-checkout: agents/claude-review
      - name: Review PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python _agent/agents/claude-review/claude_review.py \
            --pr "${{ github.repository }}#${{ github.event.pull_request.number }}" \
            -o review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"
