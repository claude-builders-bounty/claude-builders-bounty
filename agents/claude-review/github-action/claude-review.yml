name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and post structured review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 agents/claude-review/bin/claude-review \
            --pr "${{ github.event.pull_request.html_url }}" \
            --post-comment
