name: claude-review

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch claude-review
        # Adjust SCRIPT_PATH if you place claude-review in a subdirectory.
        run: |
          SCRIPT_PATH="agents/pr-review/claude-review"
          curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/main/${SCRIPT_PATH}" -o claude-review
          chmod +x claude-review

      - name: Review the PR diff
        run: |
          ./claude-review \
            --pr "https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}" \
            --output review.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post review as a comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
