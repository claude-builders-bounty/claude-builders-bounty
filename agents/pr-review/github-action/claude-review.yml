# Claude PR Review — GitHub Action
#
# Copy this file to .github/workflows/claude-review.yml in YOUR repository.
# It runs claude-review on every pull request and posts a structured review
# comment. Requires one repository secret: ANTHROPIC_API_KEY.
#
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Allow the workflow to read the diff and write a comment back to the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run claude-review and post comment
        env:
          # Auth for the Claude Code CLI.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # gh uses this automatically; scoped to this repo by `permissions` above.
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # The claude-review script lives in your repo; adjust the path if needed.
          chmod +x agents/pr-review/claude-review
          ./agents/pr-review/claude-review --pr "$PR_URL" --post
