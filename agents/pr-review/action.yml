name: "Claude Code PR Review"
description: "Analyze a PR diff and post a structured review comment using Claude."
author: "claude-builders-bounty"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  pr-url:
    description: "URL of the PR to review"
    required: true
  github-token:
    description: "GitHub token for API access and posting comments"
    required: true
  anthropic-api-key:
    description: "Anthropic API key for Claude"
    required: true
  model:
    description: "Claude model to use"
    required: false
    default: "claude-sonnet-4-20250514"

runs:
  using: "composite"
  steps:
    - name: Run claude-review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        python3 ${{ github.action_path }}/claude_review.py \
          --pr "${{ inputs.pr-url }}" \
          --post \
          --model "${{ inputs.model }}"
