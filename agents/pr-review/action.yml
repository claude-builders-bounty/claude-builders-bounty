name: 'PR Review Agent'
description: 'Automated structured PR review powered by multi-rule analysis'
author: 'Claude Builders Community'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}
  pr-number:
    description: 'PR number to review'
    required: false
    default: ${{ github.event.pull_request.number }}

outputs:
  review-comment-id:
    description: 'ID of the posted review comment'
  confidence:
    description: 'Review confidence score (Low/Medium/High)'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run PR Review Agent
      id: review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        python ${{ github.action_path }}/../review.py \
          --repo ${{ github.repository }} \
          --local ${{ inputs.pr-number }} \
          --output /tmp/review-output.md

        echo "Review generated successfully"
        cat /tmp/review-output.md

    - name: Post Review Comment
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/review-output.md', 'utf8');
          await github.rest.issues.createComment({
            issue_number: ${{ inputs.pr-number }},
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
