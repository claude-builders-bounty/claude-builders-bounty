name: claude-review
description: Review a pull request and output a structured Markdown review (Summary / Risks / Suggestions / Confidence)
author: claude-builders-bounty contributors
branding:
  icon: eye
  color: blue
inputs:
  pr-url:
    description: "GitHub PR URL to review, e.g. https://github.com/owner/repo/pull/123"
    required: true
  post-comment:
    description: "Post the review as a PR comment (true/false). Default false — read-only."
    required: false
    default: "false"
  output-file:
    description: "File to write the Markdown review to"
    required: false
    default: "claude-review.md"
outputs:
  review-file:
    description: "Path to the Markdown review file"
    value: ${{ inputs.output-file }}
  confidence:
    description: "Confidence of the review: Low / Medium / High"
    value: ${{ steps.review.outputs.confidence }}
runs:
  using: composite
  steps:
    - name: Run claude-review
      id: review
      shell: bash
      run: |
        python3 "${{ github.action_path }}/claude-review.py" \
          --pr "${{ inputs.pr-url }}" \
          --output "${{ inputs.output-file }}"
        CONFIDENCE=$(grep -o '### ✅ Confidence: [A-Za-z]*' "${{ inputs.output-file }}" | awk '{print $NF}')
        echo "confidence=$CONFIDENCE" >> "$GITHUB_OUTPUT"
