# Copy to .github/workflows/claude-review.yml on the trusted default branch.
name: Claude review (manual)
on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: "HTTPS GitHub PR URL in this repository"
        required: true
        type: string
      post_comment:
        description: "Publish the generated review as a PR conversation comment"
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install ./agents/pr-review
      - name: Validate target without exposing model credentials
        env:
          PR_URL: ${{ inputs.pr_url }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          python - <<'PYTHON'
          import os
          from claude_review import parse_pr_url
          pr = parse_pr_url(os.environ["PR_URL"])
          if f"{pr.owner}/{pr.repo}".lower() != os.environ["EXPECTED_REPO"].lower():
              raise SystemExit("Refusing a PR outside this workflow's repository")
          PYTHON
      - name: Review trusted code against untrusted diff data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ inputs.pr_url }}
          POST_COMMENT: ${{ inputs.post_comment }}
        shell: bash
        run: |
          args=(--backend anthropic --pr "$PR_URL" --output review.md)
          if [[ "$POST_COMMENT" == "true" ]]; then args+=(--post); fi
          claude-review "${args[@]}"
      - name: Preserve generated review in the run summary, including posting failures
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f review.md ]]; then cat review.md >> "$GITHUB_STEP_SUMMARY"; fi
