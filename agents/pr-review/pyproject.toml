[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-bounty-pr-review"
version = "1.0.0"
description = "Read-only Claude Code PR reviewer with validated Markdown output"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
claude-review = "claude_review:main"

[tool.setuptools]
py-modules = ["claude_review"]

[tool.coverage.run]
source = ["claude_review"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
