name: 'Claude PR Reviewer'
description: 'Reviews PRs with Claude Code and posts structured feedback'
author: 'Claude Builders Bounty'

inputs:
  pr-url:
    description: 'GitHub PR URL'
    required: true
  github-token:
    description: 'GitHub token for API access'
    required: false
  claude-api-key:
    description: 'Claude API key'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: pip install -r agents/pr_reviewer/requirements.txt
      
    - name: Run PR Review
      run: python agents/pr_reviewer/claude_pr_reviewer.py --pr ${{ inputs.pr-url }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}