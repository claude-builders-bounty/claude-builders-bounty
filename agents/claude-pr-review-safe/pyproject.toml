[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pr-review-safe"
version = "0.1.0"
description = "A guarded CLI for reviewing public GitHub pull request diffs with Claude Code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claude-review = "claude_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
