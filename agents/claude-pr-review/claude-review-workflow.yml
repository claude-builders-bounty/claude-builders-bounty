name: Claude Code PR Review Agent
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Structured PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node agents/claude-pr-review/claude-review.mjs --pr "https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}" > review.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
