[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pr-reviewer-agent"
version = "0.1.0"
description = "Dependency-free structured PR reviewer CLI for Claude Code bounty #4"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
claude-review = "claude_review.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_review*"]
