[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pr-reviewer"
version = "0.1.0"
description = "Claude Code-friendly PR diff reviewer"
requires-python = ">=3.10"

[project.scripts]
claude-review = "claude_review:run"

[tool.setuptools]
py-modules = ["claude_review"]
