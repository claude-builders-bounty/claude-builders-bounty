name: PR Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '/review')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR number
        id: pr
        run: echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          claude -p --output-format text \
            "$(cat agents/pr-reviewer/pr-reviewer.md)" \
            "$(gh pr diff ${{ steps.pr.outputs.number }})" > review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh pr comment ${{ steps.pr.outputs.number }} --body-file review.md
