# Drop-in GitHub Action for the pr-reviewer agent.
#
# To use: copy this file into `.github/workflows/pr-review.yml` in your repo,
# add `ANTHROPIC_API_KEY` to repository secrets (optional — falls back to
# heuristic mode without it), and the workflow will post a single review
# comment per PR that updates in place on subsequent pushes.

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewer agent
        uses: actions/checkout@v4
        with:
          repository: claude-builders-bounty/claude-builders-bounty
          path: claude-review
          sparse-checkout: agents/pr-reviewer
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python claude-review/agents/pr-reviewer/claude_review.py \
            --pr "${{ github.event.pull_request.html_url }}" \
            --mode hybrid \
            --post
