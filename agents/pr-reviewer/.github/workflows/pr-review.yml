# GitHub Action: post a Claude PR review comment when a PR opens / updates.
# Drop into <repo>/.github/workflows/pr-review.yml and set ANTHROPIC_API_KEY in
# your repo secrets. The workflow uses GITHUB_TOKEN automatically for PR access.
#
# Trigger: every PR open / synchronize / reopen. Edit the `if:` to scope further
# (e.g. only PRs targeting `main`, only when the author is not Dependabot, etc.).

name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Check out claude-review script
        uses: actions/checkout@v4
        with:
          repository: claude-builders-bounty/claude-builders-bounty
          path: claude-review-tool
          sparse-checkout: agents/pr-reviewer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run claude-review and post comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python claude-review-tool/agents/pr-reviewer/bin/claude-review.py --pr "$PR_URL" --post
