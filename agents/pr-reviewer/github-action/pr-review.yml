# PR Reviewer — automated structured Markdown review on every pull request.
#
# Install: copy this file to `.github/workflows/pr-review.yml` in your repo and
# add an `ANTHROPIC_API_KEY` repository secret
# (Settings → Secrets and variables → Actions).
#
# It fetches the PR diff, runs the reviewer, and posts/updates a single sticky
# review comment on the PR.
name: PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least-privilege: read the code, write the review comment.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the agent
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r agents/pr-reviewer/requirements.txt

      - name: Fetch the PR diff
        run: gh pr diff "$PR_NUMBER" > /tmp/pr.diff

      - name: Generate the review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_REVIEW_MODEL: claude-sonnet-4-6
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python agents/pr-reviewer/scripts/pr_review.py \
            --diff /tmp/pr.diff \
            --title "$PR_TITLE" \
            --out /tmp/review.md
          {
            echo "<!-- pr-reviewer-agent -->"
            echo "## 🤖 Automated PR Review"
            echo
            cat /tmp/review.md
            echo
            echo "_Generated by the [PR Reviewer agent](https://github.com/${{ github.repository }}/tree/main/agents/pr-reviewer). Advisory only._"
          } > /tmp/comment.md

      - name: Post or update the sticky review comment
        run: |
          # Find a previous review comment by its hidden marker.
          comment_id=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- pr-reviewer-agent -->")) | .id' | head -n1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" \
              -F body=@/tmp/comment.md >/dev/null
            echo "Updated existing review comment ($comment_id)."
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
            echo "Posted a new review comment."
          fi
