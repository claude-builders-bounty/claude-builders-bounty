name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: Pull request URL to review
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate structured PR review
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_URL: ${{ github.event.inputs.pr_url }}
          EVENT_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          PR_URL="$INPUT_PR_URL"
          if [ -z "$PR_URL" ]; then
            PR_URL="$EVENT_PR_URL"
          fi

          python agents/pr-reviewer/claude_review.py \
            --pr "$PR_URL" \
            --output claude-pr-review.md

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-pr-review
          path: claude-pr-review.md

      - name: Post review comment
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_URL: ${{ github.event.inputs.pr_url }}
          EVENT_PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          PR_URL="$INPUT_PR_URL"
          if [ -z "$PR_URL" ]; then
            PR_URL="$EVENT_PR_URL"
          fi

          gh pr comment "$PR_URL" --body-file claude-pr-review.md
