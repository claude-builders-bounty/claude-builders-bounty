# Claude PR Reviewer — GitHub Action
#
# Posts a structured Markdown review (Summary / Risks / Suggestions / Confidence)
# as a comment on every opened/updated PR, using the `claude-review` CLI.
#
# Setup:
#   1. Copy this file to .github/workflows/claude-review.yml in your repo.
#   2. Add a repository secret ANTHROPIC_API_KEY (Settings → Secrets → Actions).
#   3. (If this workflow lives outside this folder) adjust SCRIPT path below.
#
# It runs the same CLI used locally; in CI the CLI talks to the Anthropic API
# via ANTHROPIC_API_KEY (no interactive Claude Code login needed).

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true

permissions:
  contents: read
  pull-requests: write   # needed to post the review comment

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review PR with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # Path to the claude-review script within this repo:
          SCRIPT: agents/pr-reviewer/claude-review
          # PR number: from the PR event, or from manual dispatch input.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          set -euo pipefail
          chmod +x "$SCRIPT"
          "./$SCRIPT" --pr "${{ github.repository }}#${PR_NUMBER}" --post
