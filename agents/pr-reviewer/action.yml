name: "Claude Code PR Reviewer"
description: "Autonomous GitHub Action that analyzes PR diffs and generates structured review comments"
author: "Claude Builders Community"
inputs:
  pr_url:
    description: "The full URL or event PR URL"
    required: false
    default: ${{ github.event.pull_request.html_url }}
  github_token:
    description: "GitHub token to post PR comments and fetch diffs"
    required: true
    default: ${{ github.token }}
  post_comment:
    description: "Whether to post review as comment on PR"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Run Reviewer
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        EXTRA_FLAGS=""
        if [ "${{ inputs.post_comment }}" = "true" ]; then
          EXTRA_FLAGS="--post-comment"
        fi
        python ${{ github.action_path }}/claude_review.py --pr "${{ inputs.pr_url }}" $EXTRA_FLAGS
