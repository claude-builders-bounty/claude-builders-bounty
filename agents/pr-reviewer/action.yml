name: Claude PR Review
description: Generate a structured Markdown PR review from the pull request diff.

inputs:
  pr-url:
    description: GitHub pull request URL to review.
    required: true

runs:
  using: composite
  steps:
    - name: Run claude-review
      shell: bash
      run: |
        python "$GITHUB_ACTION_PATH/claude_review.py" --pr "${{ inputs.pr-url }}" >> "$GITHUB_STEP_SUMMARY"
