name: Claude PR Reviewer
description: Run claude-review against a pull request and publish annotations, summary, and an optional PR comment.

inputs:
  pr:
    description: GitHub pull request URL or owner/repo#123 shorthand.
    required: true
  repo-root:
    description: Local checkout root used for downstream reference scanning.
    required: false
    default: "."
  token:
    description: GitHub token used by gh for fetching private PRs and posting comments.
    required: false
    default: ""
  update-comment:
    description: Update the previous generated PR comment instead of posting a new one.
    required: false
    default: "true"
  allow-comment-failure:
    description: Continue when PR comment posting fails, useful for fork PR read-only tokens.
    required: false
    default: "true"
  fail-on:
    description: Optional severity gate. Set to Low, Medium, or High to fail the job when matching findings are present.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install claude-review
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Run claude-review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
        CLAUDE_REVIEW_PR: ${{ inputs.pr }}
        CLAUDE_REVIEW_REPO_ROOT: ${{ inputs.repo-root }}
        CLAUDE_REVIEW_UPDATE_COMMENT: ${{ inputs.update-comment }}
        CLAUDE_REVIEW_ALLOW_COMMENT_FAILURE: ${{ inputs.allow-comment-failure }}
        CLAUDE_REVIEW_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(
          --pr "${CLAUDE_REVIEW_PR}"
          --repo-root "${CLAUDE_REVIEW_REPO_ROOT}"
          --github-annotations
          --step-summary
        )

        if [ "${CLAUDE_REVIEW_UPDATE_COMMENT}" = "true" ]; then
          args+=(--update-comment)

          if [ "${CLAUDE_REVIEW_ALLOW_COMMENT_FAILURE}" = "true" ]; then
            args+=(--allow-comment-failure)
          fi
        fi

        if [ -n "${CLAUDE_REVIEW_FAIL_ON}" ]; then
          args+=(--fail-on "${CLAUDE_REVIEW_FAIL_ON}")
        fi

        claude-review "${args[@]}"
