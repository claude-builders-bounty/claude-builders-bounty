name: "Claude Code PR Reviewer"
description: "Automatically reviews pull requests using Claude and posts a structured review comment."
author: "Suresh Chouksey"
branding:
  icon: "eye"
  color: "green"

inputs:
  pr-url:
    description: "The full URL of the pull request to review (e.g. https://github.com/owner/repo/pull/123)"
    required: false
  anthropic-key:
    description: "Your Anthropic API key to call Claude"
    required: true
  github-token:
    description: "Your GITHUB_TOKEN to read the PR diff and write the comment"
    required: false
    default: ${{ github.token }}
  model:
    description: "Anthropic model to use for the review"
    required: false
    default: "claude-3-5-sonnet-20241022"

runs:
  using: "composite"
  steps:
    - name: Run PR Reviewer
      shell: bash
      env:
        INPUT_PR_URL: ${{ inputs.pr-url }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python3 ${{ github.action_path }}/claude_review.py --model "${{ inputs.model }}"
