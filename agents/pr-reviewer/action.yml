name: "PR Reviewer Sub-Agent"
description: "Automatically reviews Pull Request diffs and posts structured feedback."
author: "Elite Agency"
inputs:
  github-token:
      description: "GitHub token for API access"
          required: true
            ai-api-key:
                description: "API key for the AI backend (Gemini/Claude)"
                    required: false
                    runs:
                      using: "node20"
                        main: "dist/index.js"
                        branding:
                          icon: "cpu"
                            color: "blue"
                            
