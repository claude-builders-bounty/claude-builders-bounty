name: "Claude Code PR Reviewer"
description: "Automatically analyzes PR diffs and publishes structured code reviews"
author: "@satyadilip"
inputs:
  pr_url:
    description: "GitHub Pull Request URL"
    required: false
    default: "${{ github.event.pull_request.html_url }}"
  github_token:
    description: "GitHub Token for posting review comments"
    required: true
    default: "${{ github.token }}"
  post_comment:
    description: "Whether to post review directly to PR"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run Reviewer Agent
      shell: bash
      run: |
        python agents/pr-reviewer/claude_review.py \
          --pr "${{ inputs.pr_url }}" \
          --token "${{ inputs.github_token }}" \
          --post
