name: "Claude Code PR Reviewer"
description: "Analyzes pull request diffs and posts structured Markdown review comments with risk detection."
inputs:
  github-token:
    description: "GitHub token for reading PR diffs and posting review comments"
    required: true
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Run PR Reviewer Agent
      shell: bash
      run: |
        python agents/pr-reviewer/reviewer.py \
          --pr "${{ github.event.pull_request.html_url }}" \
          --output "pr_review.md"
    - name: Post Review Comment
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('pr_review.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
