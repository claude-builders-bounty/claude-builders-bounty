name: "Claude Code PR Reviewer"
description: "Autonomous code review agent for GitHub Pull Requests"
author: "Wilian Colombo"

inputs:
  github_token:
    description: "GitHub token for reading PR diffs and posting review comments"
    required: true
    default: ${{ github.token }}
  pr_url:
    description: "Full URL of the Pull Request to review"
    required: false
    default: ${{ github.event.pull_request.html_url }}
  post_comment:
    description: "Whether to post the review as a PR comment"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run Reviewer Agent
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        python3 ${{ github.action_path }}/claude_review.py \
          --pr "${{ inputs.pr_url }}" \
          ${{ inputs.post_comment == 'true' && '--post' || '' }}
