name: 'Claude Code PR Reviewer'
description: 'Automated PR reviewer sub-agent that analyzes diffs and posts structured review comments.'
inputs:
  pr-url:
    description: 'Full URL to the pull request'
    required: true
  github-token:
    description: 'GitHub Token for accessing the PR'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run PR Reviewer
      shell: bash
      run: |
        python claude_review.py --pr "${{ inputs.pr-url }}" --token "${{ inputs.github-token }}"
