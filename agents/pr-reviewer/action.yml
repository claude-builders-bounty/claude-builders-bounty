name: "Claude Code PR Reviewer"
description: "Autonomous GitHub Pull Request review sub-agent generating structured Markdown reviews with risk analysis."
author: "Claude Builders Community"
inputs:
  github-token:
    description: "GitHub Token for API access and comment posting"
    required: true
    default: "${{ github.token }}"
  post-comment:
    description: "Whether to post the generated review directly to the PR"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run PR Reviewer Sub-Agent
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python agents/pr-reviewer/claude_review.py \
          --pr "${{ github.event.pull_request.html_url }}" \
          ${{ inputs.post-comment == 'true' && '--post-comment' || '' }} \
          --output "pr-review.md"
