name: "Claude Code PR Reviewer"
description: "Automatically analyzes PR diffs and posts structured Markdown review comments"
inputs:
  github-token:
    description: "GitHub Token for fetching diff and posting comments"
    required: true
runs:
  using: "composite"
  steps:
    - name: Run Reviewer
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        node agents/pr-reviewer/pr_reviewer.js --pr "$PR_URL" > review.md
        gh pr comment "$PR_URL" --body-file review.md
