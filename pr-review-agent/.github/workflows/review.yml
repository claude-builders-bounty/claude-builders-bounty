name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          # No external dependencies needed — uses stdlib only

      - name: Run PR review
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          # Determine the PR number from the event
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          # Locate the review script (supports both subdir and root layouts)
          SCRIPT=""
          for candidate in \
            ".github/actions/pr-review-agent/claude-review.py" \
            "pr-review-agent/claude-review.py" \
            "claude-review.py"; do
            if [ -f "$candidate" ]; then
              SCRIPT="$candidate"
              break
            fi
          done

          if [ -z "$SCRIPT" ]; then
            echo "::warning::claude-review.py not found. Check the action path."
            echo "review_output=Script not found." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::group::Running claude-review on PR #${PR_NUMBER}"
          python "$SCRIPT" \
            --pr "https://github.com/${REPO}/pull/${PR_NUMBER}" \
            --format markdown \
            > review_output.md 2>&1 || true
          echo "::endgroup::"

          echo "review_output<<EOF" >> "$GITHUB_OUTPUT"
          cat review_output.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.review.outputs.review_output }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Find existing review comment from this action
            const botComment = comments.find(
              c => c.user.type === 'Bot' &&
                   c.body.includes('claude-review-agent') &&
                   c.body.includes('Confidence Score')
            );

            const body = `## 🤖 PR Review (Automated)\n\n${output}`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
