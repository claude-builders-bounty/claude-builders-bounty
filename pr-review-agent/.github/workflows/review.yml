name: AI PR Review (claude-review)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Fork PRs don't receive secrets; skip cleanly instead of failing red.
    # (secrets context is evaluated server-side, so this works at job level)
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo mkdir -p -m 755 /etc/apt/keyrings \
            && wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt-get update \
            && sudo apt-get install -y gh
          fi
          gh --version

      - name: Generate structured review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 pr-review-agent/claude_review.py \
            --repo "${{ github.repository }}" \
            --number "${{ github.event.pull_request.number }}" \
            --write review.md
          echo "--- claude-review output ---"
          cat review.md
          {
            echo 'REVIEW_BODY<<CLAUDE_REVIEW_EOF'
            cat review.md
            echo 'CLAUDE_REVIEW_EOF'
          } >> "$GITHUB_ENV"

      - name: Post or update review comment
        uses: actions/github-script@v7
        env:
          # Passed via env — never interpolated into this JS — so backticks,
          # ${...}, or HTML in the review text cannot inject code here.
          REVIEW_BODY: ${{ env.REVIEW_BODY }}
        with:
          script: |
            const body = process.env.REVIEW_BODY;
            const MARKER = '<!-- claude-review';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`updated existing claude-review comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('posted new claude-review comment');
            }
