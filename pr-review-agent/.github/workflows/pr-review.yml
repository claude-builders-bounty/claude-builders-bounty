name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout PR Review Agent
        uses: actions/checkout@v4
        with:
          repository: claude-builders-bounty/claude-builders-bounty
          path: pr-review-agent

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd pr-review-agent/pr-review-agent
          pip install -r requirements.txt

      - name: Run Claude PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd pr-review-agent/pr-review-agent
          python claude-review.py \
            --repo ${{ github.repository }} \
            --pr-number ${{ github.event.pull_request.number }} \
            --output review.md

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('pr-review-agent/pr-review-agent/review.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 Claude PR Review\n\n${review}\n\n---\n*Automated review powered by Claude Sonnet 4 via [claude-review](https://github.com/claude-builders-bounty/claude-builders-bounty/tree/main/pr-review-agent)*`
            });
