name: PR review

# pull_request_target (not pull_request) so the job gets a write token and can
# comment on PRs opened from forks. This is safe **only** because the job never
# checks out or executes code from the pull request: it checks out the base
# repository and reads the diff through the GitHub API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted base code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: pr-review-agent
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Review the pull request
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 pr-review-agent/claude-review \
            --pr "$PR_URL" \
            --post \
            --output review.md

      - name: Upload the review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review
          path: review.md
          if-no-files-found: ignore
