name: 'AI PR Review'
description: 'Automated code review using Claude AI'
author: 'Claude'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}

  anthropic-api-key:
    description: 'Anthropic API key for Claude'
    required: true

  model:
    description: 'Claude model to use'
    required: false
    default: 'claude-sonnet-4-20250514'

  max-tokens:
    description: 'Max tokens for response'
    required: false
    default: '4096'

runs:
  using: 'node20'
  main: 'dist/cli.js'
  args:
    - '--pr'
    - ${{ github.event.pull_request.html_url }}
    - '--token'
    - ${{ inputs.github-token }}
    - '--model'
    - ${{ inputs.model }}
    - '--max-tokens'
    - ${{ inputs.max-tokens }}

branding:
  color: 'purple'
  icon: 'message-square'
