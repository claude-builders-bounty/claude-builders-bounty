name: Claude PR Review

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_url:
        description: "PR URL to review"
        required: true

jobs:
  review:
    if: ${{ contains(github.event.comment.body, '/claude-review') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gh CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Run review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ github.event.issue.pull_request.html_url || inputs.pr_url }}"
          python3 submissions/wasim-builds/claude-review/claude-review --pr "$PR_URL" --out review.md

      - name: Post review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ github.event.issue.pull_request.html_url || inputs.pr_url }}"
          NUM=$(echo "$PR_URL" | grep -oE 'pull/[0-9]+' | cut -d/ -f2)
          OWNER=$(echo "$PR_URL" | grep -oE 'github\.com/[^/]+' | cut -d/ -f2)
          REPO=$(echo "$PR_URL" | grep -oE 'github\.com/[^/]+/[^/]+' | cut -d/ -f3)
          gh pr comment "$NUM" --repo "$OWNER/$REPO" --body-file review.md
