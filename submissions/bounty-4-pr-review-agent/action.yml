name: 'Claude PR Review'
description: 'Automated PR review using Claude Code'
author: '蛋头先生'
branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}
  anthropic-api-key:
    description: 'Anthropic API key for Claude'
    required: true
  pr-url:
    description: 'PR URL to review (defaults to current PR)'
    required: false
  post-comment:
    description: 'Post review as PR comment'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      shell: bash
      run: |
        npm install -g typescript
        cd ${{ github.action_path }}
        npm install
        npm run build
    
    - name: Run PR Review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        PR_URL="${{ inputs.pr-url || format('https://github.com/{0}/pull/{1}', github.repository, github.event.pull_request.number) }}"
        cd ${{ github.action_path }}
        node dist/cli.js --pr "$PR_URL" --post-comment
