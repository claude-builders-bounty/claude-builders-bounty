name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review PR with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download the review script
          curl -sO https://raw.githubusercontent.com/guidou2013-bot/claude-builders-bounty/main/submissions/pr-reviewer/claude-review.sh
          chmod +x claude-review.sh

          # Run the review
          PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          bash claude-review.sh \
            --pr "$PR_URL" \
            --output review.md \
            --model claude-haiku-4-5-20251001

          echo "REVIEW_CONTENT<<EOF" >> $GITHUB_ENV
          cat review.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = process.env.REVIEW_CONTENT;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: review + '\n\n---\n*🤖 Automated review by [claude-review](https://github.com/guidou2013-bot/claude-builders-bounty/tree/main/submissions/pr-reviewer)*'
            });
