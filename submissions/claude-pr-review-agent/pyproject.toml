[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pr-review-agent"
version = "0.1.0"
description = "CLI and GitHub Action PR review agent for Claude Code builders"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claude-review = "claude_pr_review_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
