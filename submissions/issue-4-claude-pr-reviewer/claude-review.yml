# Claude PR Reviewer — GitHub Action
#
# Place this file at .github/workflows/claude-review.yml in your repo.
# It runs claude-review on every opened / updated pull request and posts the
# review as a PR comment.
#
# Setup (one time):
#   1. Add a repository secret named ANTHROPIC_API_KEY (Settings → Secrets and
#      variables → Actions → New repository secret).
#   2. Commit this file plus claude_review.py under .github/workflows/ (or point
#      the "python" step at wherever you keep claude_review.py).
#
# GITHUB_TOKEN is provided automatically by Actions; the permissions block below
# grants it the write access needed to post the comment.

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/workflows/claude_review.py \
            --pr "${{ github.event.pull_request.html_url }}" \
            --post
