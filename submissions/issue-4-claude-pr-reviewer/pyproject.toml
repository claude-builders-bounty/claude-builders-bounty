[project]
name = "claude-review"
version = "1.0.0"
description = "AI pull-request reviewer powered by Claude"
requires-python = ">=3.8"
dependencies = ["anthropic>=0.40"]

[project.scripts]
claude-review = "claude_review:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["claude_review"]
