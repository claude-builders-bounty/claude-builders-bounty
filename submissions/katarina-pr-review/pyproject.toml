[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "katarina-claude-pr-review"
version = "0.1.0"
description = "Safe, opt-in Claude GitHub PR review CLI"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
claude-review = "review_pr:main"

[tool.setuptools]
py-modules = ["review_pr"]
