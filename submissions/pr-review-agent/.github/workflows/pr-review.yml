name: PR Review Agent
on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: "Full GitHub PR URL"
        required: true
  issue_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '/review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run review
        run: python claude_review.py --pr "${{ inputs.pr_url || github.event.issue.pull_request.url }}"
      - name: Post comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const out = execSync('python claude_review.py --pr ${{ github.event.issue.pull_request.html_url }}').toString();
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: out
            });
