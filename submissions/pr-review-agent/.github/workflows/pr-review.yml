name: PR Review (claude-review)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install claude-review
        run: |
          curl -sL https://raw.githubusercontent.com/laogongcy-del/claude-builders-bounty/main/submissions/pr-review-agent/claude-review.sh \
            -o /usr/local/bin/claude-review
          chmod +x /usr/local/bin/claude-review

      - name: Run review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          claude-review \
            --pr "${{ github.event.pull_request.html_url }}" \
            --output review-output.md

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review-output.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: review
            });
