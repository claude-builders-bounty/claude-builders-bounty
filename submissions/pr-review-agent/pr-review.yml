# .github/workflows/pr-review.yml
#
# Claude Code PR Review Agent — GitHub Actions workflow
#
# Triggers automatically on every pull_request event and posts a structured
# review comment written by Claude.
#
# Required secrets (set in Settings → Secrets and variables → Actions):
#   CLAUDE_SESSION   — value of ~/.claude/session (or ANTHROPIC_API_KEY if
#                       you prefer the API; adjust the claude invocation below)
#
# The workflow uses gh CLI (pre-installed on GitHub runners) for all GitHub
# operations, so no extra tokens are needed beyond the default GITHUB_TOKEN.

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write   # needed to post the review comment
  contents: read

jobs:
  review:
    name: Review PR with Claude
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Claude CLI
        run: pip install claude-code-cli
        # Or: npm install -g @anthropic-ai/claude-code
        # The claude binary must be on PATH and authenticated.

      # Authenticate claude CLI using a stored session token
      - name: Authenticate Claude
        run: |
          mkdir -p ~/.claude
          echo "${{ secrets.CLAUDE_SESSION }}" > ~/.claude/session
        env:
          CLAUDE_SESSION: ${{ secrets.CLAUDE_SESSION }}

      - name: Run PR Review Agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python submissions/pr-review-agent/claude-review \
            --pr "$PR_URL" \
            --post
