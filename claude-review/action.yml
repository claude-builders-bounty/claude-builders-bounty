name: 'Claude PR Review'
description: 'Automated PR review using Claude Code'
inputs:
  github-token:
    description: 'GitHub token for API access and posting comments'
    required: true
  post-comment:
    description: 'Whether to post the review as a PR comment'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Claude Review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        POST_COMMENT: ${{ inputs.post-comment }}
      run: |
        cd ${{ github.action_path }}
        if [ "$POST_COMMENT" = "true" ]; then
          node bin/claude-review.js --pr "$PR_URL" --post
        else
          node bin/claude-review.js --pr "$PR_URL"
        fi
