name: "PR Review (Claude)"
description: >
  Automatically reviews every opened or updated PR using Claude and posts a
  structured review comment. Powered by claude-review.

branding:
  icon: "check-circle"
  color: "green"

inputs:
  github-token:
    description: "GitHub token with pull-requests: write permission"
    required: true
    default: ${{ github.token }}
  anthropic-api-key:
    description: "Anthropic API key for Claude"
    required: true
  model:
    description: "Claude model to use"
    required: false
    default: "claude-sonnet-4-20250514"

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run claude-review
      id: review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python ${{ github.action_path }}/claude_review.py \
          --pr "${{ github.event.pull_request.html_url }}" \
          --output /tmp/review.md \
          --model "${{ inputs.model }}"

    - name: Post review comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body "$(cat /tmp/review.md)"
