[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "claude-review"
version = "1.0.0"
description = "A Claude Code agent that reviews GitHub PRs and posts structured comments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
scripts.claude-review = "claude_review:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
