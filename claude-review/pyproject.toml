[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-review"
version = "0.1.0"
description = "AI-powered PR reviewer using Claude"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "requests>=2.31.0",
]

[project.scripts]
claude-review = "claude_review:main"

[tool.setuptools]
py-modules = ["claude_review"]
