name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PR info
        id: pr
        run: |
          echo "url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
          echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Run claude-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ steps.pr.outputs.url }}"
          REPO="${{ github.repository }}"
          PR_NUM="${{ steps.pr.outputs.number }}"

          # Fetch PR metadata
          PR_DATA=$(gh pr view "$PR_NUM" --repo "$REPO" --json title,additions,deletions,changedFiles,files,commits)

          TITLE=$(echo "$PR_DATA" | python3 -c "import json,sys; print(json.load(sys.stdin)['title'])")
          ADDITIONS=$(echo "$PR_DATA" | python3 -c "import json,sys; print(json.load(sys.stdin)['additions'])")
          DELETIONS=$(echo "$PR_DATA" | python3 -c "import json,sys; print(json.load(sys.stdin)['deletions'])")
          CHANGED_FILES=$(echo "$PR_DATA" | python3 -c "import json,sys; print(json.load(sys.stdin)['changedFiles'])")
          COMMITS=$(echo "$PR_DATA" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['commits']))")
          FILES=$(echo "$PR_DATA" | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for f in data['files']:
              print(f'{f[\"path\"]} (+{f[\"additions\"]}/-{f[\"deletions\"]})')
          ")

          DIFF=$(gh pr diff "$PR_NUM" --repo "$REPO" | head -3000)

          # Analyze
          RISKS=""
          SUGGESTIONS=""
          CONFIDENCE="Medium"

          if echo "$DIFF" | grep -qiE '(eval\(|innerHTML|dangerouslySetInnerHTML|password|secret|token|api.key)'; then
            RISKS="${RISKS}\n- **Security**: Potential sensitive data or unsafe code patterns"
          fi
          if echo "$DIFF" | grep -qiE '(console\.log|debugger|TODO|FIXME)'; then
            RISKS="${RISKS}\n- **Cleanup**: Debug statements or TODOs found"
          fi
          if [ "$ADDITIONS" -gt 500 ]; then
            RISKS="${RISKS}\n- **Size**: Large PR (+${ADDITIONS}) — consider splitting"
            CONFIDENCE="Low"
          fi

          HAS_TESTS=false
          if echo "$FILES" | grep -qiE '(\.test\.|\.spec\.)'; then HAS_TESTS=true; fi
          if [ "$HAS_TESTS" = false ] && [ "$ADDITIONS" -gt 50 ]; then
            SUGGESTIONS="${SUGGESTIONS}\n- Add tests for new code"
          fi
          if echo "$DIFF" | grep -qE '\bany\b'; then
            SUGGESTIONS="${SUGGESTIONS}\n- Replace \`any\` types with proper TypeScript types"
          fi

          if [ "$CHANGED_FILES" -le 3 ] && [ "$ADDITIONS" -lt 100 ]; then CONFIDENCE="High"; fi
          if [ "$CHANGED_FILES" -gt 10 ] || [ "$ADDITIONS" -gt 300 ]; then CONFIDENCE="Low"; fi

          [ -z "$RISKS" ] && RISKS="\n- No significant risks identified"
          [ -z "$SUGGESTIONS" ] && SUGGESTIONS="\n- Changes look clean"

          # Build review comment
          BODY=$(cat <<REVIEW_EOF
          ## PR Review: ${TITLE}

          **${REPO}#${PR_NUM}** | ${COMMITS} commit(s) | ${CHANGED_FILES} file(s) | +${ADDITIONS}/-${DELETIONS}

          ### Summary
          This PR modifies ${CHANGED_FILES} file(s) with ${ADDITIONS} additions and ${DELETIONS} deletions across ${COMMITS} commit(s).

          ### Identified Risks
          $(echo -e "$RISKS")

          ### Suggestions
          $(echo -e "$SUGGESTIONS")

          ### Confidence: **${CONFIDENCE}**

          ---
          *Generated by claude-review GitHub Action*
          REVIEW_EOF
          )

          gh pr comment "$PR_NUM" --repo "$REPO" --body "$BODY"
