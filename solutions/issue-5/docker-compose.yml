version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-test
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./weekly-github-summary.json:/tmp/workflow.json

volumes:
  n8n_data:

# Quick Start:
# 1. docker-compose up -d
# 2. Open http://localhost:5678
# 3. Login: admin / admin123
# 4. Import workflow from /tmp/workflow.json
# 5. Configure credentials and env vars
# 6. Execute workflow to test
