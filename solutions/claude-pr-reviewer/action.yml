name: 'Claude PR Reviewer'
description: 'Automated code review of Pull Requests using Claude 3.5 Sonnet'
author: 'namdamdoi68-oss'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  pr_url:
    description: 'The URL of the Pull Request to review. If omitted, the action tries to automatically detect it from the GitHub context.'
    required: false
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  github_token:
    description: 'GitHub token to fetch the PR diff (for private repos) and post the review comment back to the PR.'
    required: false
  model:
    description: 'The Claude model to use for analysis.'
    required: false
    default: 'claude-3-5-sonnet-latest'

runs:
  using: 'composite'
  steps:
    - name: Run Review
      shell: bash
      run: |
        python3 "${{ github.action_path }}/claude-review" \
          --pr "${{ inputs.pr_url }}" \
          --model "${{ inputs.model }}"
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_ACTIONS: 'true'
