name: Claude Code PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for better diff analysis
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install anthropic
      
      - name: Analyze PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Create the review script
          cat > claude-review.py << 'EOF'
          import os
          import subprocess
          import json
          from anthropic import Anthropic
          
          # Get PR diff
          pr_url = os.environ["PR_URL"]
          parts = pr_url.split("/")
          owner, repo, pr_number = parts[3], parts[4], parts[6]
          
          api_url = f"https://api.github.com/repos/{owner}/{repo}/pulls/{pr_number}"
          
          result = subprocess.run([
              "curl", "-s", "-H", "Accept: application/vnd.github.v3.diff",
              "-H", f"Authorization: Bearer {os.environ['GITHUB_TOKEN']}",
              api_url
          ], capture_output=True, text=True)
          
          diff_text = result.stdout
          
          # Analyze with Claude
          client = Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])
          
          message = client.messages.create(
              model="claude-3-5-sonnet-20241022",
              max_tokens=1024,
              messages=[{
                  "role": "user",
                  "content": f"""Analyze this GitHub PR diff and provide a structured review.

          Diff:
          ```
          {diff_text[:50000]}
          ```

          Provide your review in this exact JSON format:
          {{
            "summary": "2-3 sentence summary of changes",
            "risks": ["list of identified risks"],
            "suggestions": ["list of improvement suggestions"],
            "confidence": "Low|Medium|High"
          }}

          Only output the JSON, no other text."""
              }]
          )
          
          # Parse response
          review_json = json.loads(message.content[0].text)
          
          # Format as Markdown
          comment = f"""# 🤖 Claude Code PR Review

          **PR:** {pr_url}

          ---

          ## 📝 Summary

          {review_json['summary']}

          ---

          ## ⚠️ Identified Risks

          """
          for risk in review_json['risks']:
              comment += f"- {risk}\n"
          
          comment += """
          ---

          ## 💡 Improvement Suggestions

          """
          for suggestion in review_json['suggestions']:
              comment += f"- {suggestion}\n"
          
          comment += f"""
          ---

          ## 🎯 Confidence Score

          **{review_json['confidence']}**

          ---

          *This review was generated by Claude Code using Claude 3.5 Sonnet.*
          """
          
          # Post comment
          comment_url = f"https://api.github.com/repos/{owner}/{repo}/issues/{pr_number}/comments"
          
          subprocess.run([
              "curl", "-s", "-X", "POST",
              "-H", "Accept: application/vnd.github+json",
              "-H", f"Authorization: Bearer {os.environ['GITHUB_TOKEN']}",
              "-H", "Content-Type: application/json",
              "-d", json.dumps({"body": comment}),
              comment_url
          ])
          
          print(f"✅ Review posted to {pr_url}")
          EOF
          
          # Run the script
          python claude-review.py
