name: Destructive Bash Guard

on:
  pull_request:
    paths:
      - "hooks/destructive-bash-guard/**"
      - "tests/test_destructive_bash_guard.py"
      - ".github/workflows/destructive-bash-guard.yml"
  push:
    paths:
      - "hooks/destructive-bash-guard/**"
      - "tests/test_destructive_bash_guard.py"
      - ".github/workflows/destructive-bash-guard.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run hook tests
        run: python -m unittest tests/test_destructive_bash_guard.py -v

      - name: Compile hook and tests
        run: python -m py_compile hooks/destructive-bash-guard/destructive_bash_guard.py tests/test_destructive_bash_guard.py

      - name: Check whitespace
        run: git diff --check
