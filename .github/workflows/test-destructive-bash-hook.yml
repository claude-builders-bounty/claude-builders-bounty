name: Test destructive Bash hook

on:
  push:
    branches:
      - codex/destructive-bash-hook
  pull_request:
    paths:
      - "bounties/003-destructive-bash-hook/**"
      - ".github/workflows/test-destructive-bash-hook.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest discover -s bounties/003-destructive-bash-hook/tests -p 'test_*.py' -v
      - name: Compile Python entrypoints
        run: python -m py_compile bounties/003-destructive-bash-hook/destructive_bash_guard.py bounties/003-destructive-bash-hook/install.py
