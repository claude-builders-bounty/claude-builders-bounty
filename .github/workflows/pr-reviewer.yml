name: PR Reviewer Agent

on:
  pull_request:
    paths:
      - ".claude/agents/pr-reviewer.md"
      - ".github/workflows/claude-review-comment.yml"
      - "agents/pr-reviewer/**"
      - "tests/test_claude_review.py"
      - ".github/workflows/pr-reviewer.yml"
  push:
    paths:
      - ".claude/agents/pr-reviewer.md"
      - ".github/workflows/claude-review-comment.yml"
      - "agents/pr-reviewer/**"
      - "tests/test_claude_review.py"
      - ".github/workflows/pr-reviewer.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run reviewer tests
        run: python -m unittest tests/test_claude_review.py -v

      - name: Compile reviewer and tests
        run: python -m py_compile agents/pr-reviewer/claude_review.py tests/test_claude_review.py

      - name: Check whitespace
        run: git diff --check
