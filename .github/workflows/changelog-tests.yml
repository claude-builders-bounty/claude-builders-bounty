name: changelog-tests
on:
  pull_request:
    paths: ['scripts/**','.claude/skills/generate-changelog/**','.github/workflows/changelog-tests.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/changelog.py --repo . --stdout