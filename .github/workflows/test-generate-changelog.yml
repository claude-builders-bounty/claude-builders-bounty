name: Test generate changelog

on:
  push:
    branches:
      - codex/generate-changelog-skill
  pull_request:
    paths:
      - "changelog.sh"
      - "skills/generate-changelog/**"
      - ".github/workflows/test-generate-changelog.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit and git integration tests
        working-directory: skills/generate-changelog
        run: python -m unittest -v test_changelog.py
      - name: Compile generator
        run: python -m py_compile skills/generate-changelog/generate_changelog.py
      - name: Smoke-test bash entrypoint
        run: bash changelog.sh --max-commits 5 --dry-run >/tmp/generated-changelog.md
