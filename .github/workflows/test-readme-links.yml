name: Test README links

on:
  pull_request:
    paths:
      - "README.md"
      - "Makefile"
      - "package.json"
      - "tests/test_readme_links.py"
      - "tests/test_peer_review_acceptance.py"
      - "tests/test_delivery_verification.py"
      - "tests/test_issue_2853_read_tool_hook.py"
      - "tests/verify-issue-2853.sh"
      - "bounties/issue-2853/**"
      - "tests/run-ci-checks.sh"
      - ".github/workflows/test-readme-links.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "Makefile"
      - "package.json"
      - "tests/test_readme_links.py"
      - "tests/test_peer_review_acceptance.py"
      - "tests/test_delivery_verification.py"
      - "tests/test_issue_2853_read_tool_hook.py"
      - "tests/verify-issue-2853.sh"
      - "bounties/issue-2853/**"
      - "tests/run-ci-checks.sh"
      - ".github/workflows/test-readme-links.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-readme-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout zeroeye implementation
        env:
          ZEROEYE_BRANCH: pr-3-read-tool-hook
        run: |
          set -euo pipefail
          if [[ -d zeroeye/.git ]]; then
            echo "Reusing existing zeroeye checkout"
            git -C zeroeye fetch --depth 1 origin "${ZEROEYE_BRANCH}"
            git -C zeroeye checkout "${ZEROEYE_BRANCH}"
          else
            git clone --depth 1 --branch "${ZEROEYE_BRANCH}" \
              https://github.com/advancedresearcharray/zeroeye.git zeroeye
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: zeroeye/market/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: bash tests/run-ci-checks.sh
        env:
          ZEROEYE_ROOT: ${{ github.workspace }}/zeroeye
