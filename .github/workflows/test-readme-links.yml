name: Test README links

on:
  pull_request:
    paths:
      - "README.md"
      - "package.json"
      - "tests/test_readme_links.py"
      - "tests/test_peer_review_acceptance.py"
      - "tests/test_delivery_verification.py"
      - "tests/run-ci-checks.sh"
      - ".github/workflows/test-readme-links.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "package.json"
      - "tests/test_readme_links.py"
      - "tests/test_peer_review_acceptance.py"
      - "tests/test_delivery_verification.py"
      - "tests/run-ci-checks.sh"
      - ".github/workflows/test-readme-links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: bash tests/run-ci-checks.sh
