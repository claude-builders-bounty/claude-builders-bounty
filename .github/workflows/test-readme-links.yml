name: Test README links

# Validates issue #521 README bounty table links on PR #2532.
# Runs the same stages as `npm test` / tests/run-ci-checks.sh locally.

on:
  pull_request:
    paths:
      - ".gitignore"
      - "README.md"
      - "Makefile"
      - "package.json"
      - "tests/test_readme_links.py"
      - "tests/test_peer_review_acceptance.py"
      - "tests/test_delivery_verification.py"
      - "tests/run-ci-checks.sh"
      - ".github/workflows/test-readme-links.yml"
  push:
    paths:
      - ".gitignore"
      - "README.md"
      - "Makefile"
      - "package.json"
      - "tests/test_readme_links.py"
      - "tests/test_peer_review_acceptance.py"
      - "tests/test_delivery_verification.py"
      - "tests/run-ci-checks.sh"
      - ".github/workflows/test-readme-links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history needed for delivery tests that diff README vs main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Unified runner: readme links → peer review → delivery → attribution guards.
      - run: bash tests/run-ci-checks.sh
