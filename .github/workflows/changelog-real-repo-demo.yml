name: Changelog real-repository demonstration
on:
  push:
    branches: [feat/changelog-generator-jrcage]
    paths:
      - 'skills/generate-changelog/**'
      - '.github/workflows/changelog-real-repo-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run unit and Git integration tests
        run: python3 -m unittest discover -s skills/generate-changelog/tests -v
      - name: Run against public pallets/itsdangerous repository
        env:
          DEMO_OUTPUT_DIR: ${{ runner.temp }}/changelog-demo
        run: bash skills/generate-changelog/real_repo_demo.sh
      - name: Save generated output and provenance
        uses: actions/upload-artifact@v4
        with:
          name: changelog-real-public-repo
          path: ${{ runner.temp }}/changelog-demo/
          if-no-files-found: error
