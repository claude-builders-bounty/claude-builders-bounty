name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test hook patterns
        run: python3 tests/test_hook.py
      - name: Verify hook is executable
        run: python3 -c "import sys; sys.path.insert(0, 'hooks'); from hook import BLOCKED_PATTERNS; print(f'Loaded {len(BLOCKED_PATTERNS)} patterns')"

  test-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test changelog generator
        run: bash tests/test_changelog.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: |
          python3 -m py_compile hooks/hook.py
          echo "✅ All Python files compile successfully"
      - name: Check shell scripts
        run: |
          bash -n changelog/generate-changelog.sh
          bash -n review-agent/claude-review
          echo "✅ All shell scripts have valid syntax"
