name: claude-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install claude-review
        run: pip install .
      - name: Run review
        run: claude-review --pr "${{ github.event.pull_request.html_url }}" --output review.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLAUDE_REVIEW_BASE_URL: ${{ secrets.CLAUDE_REVIEW_BASE_URL }}
      - name: Post review comment
        run: gh pr comment "${{ github.event.pull_request.html_url }}" --body-file review.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
