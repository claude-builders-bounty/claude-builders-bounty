name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Claude Review
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -q requests
          PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.number }}"
          python claude_review.py "$PR_URL" -o review.md
          echo "review_created=true" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        if: steps.review.outputs.review_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(cat review.md)
          gh pr comment ${{ github.event.number }} --body "$body"
