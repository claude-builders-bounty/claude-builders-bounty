name: test-block-destructive-commands

permissions:
  contents: read

concurrency:
  group: test-block-destructive-commands-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'hooks/block-destructive-commands/**'
      - '.github/workflows/test-block-destructive-commands.yml'
      - 'package.json'
      - 'Makefile'
  workflow_dispatch:
  push:
    paths:
      - 'hooks/block-destructive-commands/**'
      - '.github/workflows/test-block-destructive-commands.yml'
      - 'package.json'
      - 'Makefile'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hook regression tests
        run: bash hooks/block-destructive-commands/tests/run-ci-checks.sh
