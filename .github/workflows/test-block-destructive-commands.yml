name: test-block-destructive-commands

on:
  pull_request:
    paths:
      - 'hooks/block-destructive-commands/**'
      - '.github/workflows/test-block-destructive-commands.yml'
  push:
    paths:
      - 'hooks/block-destructive-commands/**'
      - '.github/workflows/test-block-destructive-commands.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook regression tests
        run: |
          python3 -m unittest discover -s hooks/block-destructive-commands/tests -v
          git diff --check
          if grep -rE 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor' hooks/block-destructive-commands/; then
            echo 'Forbidden agent attribution strings found in hook sources'
            exit 1
          fi
