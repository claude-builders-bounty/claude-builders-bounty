name: test-block-destructive-commands

on:
  pull_request:
    paths:
      - 'hooks/block-destructive-commands/**'
      - '.github/workflows/test-block-destructive-commands.yml'
  push:
    paths:
      - 'hooks/block-destructive-commands/**'
      - '.github/workflows/test-block-destructive-commands.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook regression tests
        run: python3 -m unittest discover -s hooks/block-destructive-commands/tests -v
