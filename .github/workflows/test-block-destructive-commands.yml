name: test-block-destructive-commands

permissions:
  contents: read

concurrency:
  group: test-block-destructive-commands-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'hooks/block-destructive-commands/**'
      - '.github/workflows/test-block-destructive-commands.yml'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'hooks/block-destructive-commands/**'
      - '.github/workflows/test-block-destructive-commands.yml'
  workflow_dispatch:
  push:
    paths:
      - 'hooks/block-destructive-commands/**'
      - '.github/workflows/test-block-destructive-commands.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook regression tests
        run: |
          python3 -m unittest discover -s hooks/block-destructive-commands/tests -v
          git diff --check
          if grep -rE 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor' hooks/block-destructive-commands/; then
            echo 'Forbidden agent attribution strings found in hook sources'
            exit 1
          fi
          if git log -1 --format=%B | grep -qiE 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor'; then
            echo 'Forbidden agent attribution strings found in latest commit message'
            exit 1
          fi
