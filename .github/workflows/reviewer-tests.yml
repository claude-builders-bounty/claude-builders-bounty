name: reviewer-tests
on:
  pull_request:
    paths: ['claude-review/**','.github/workflows/reviewer-tests.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s claude-review -p 'test_*.py'
      - name: Check restricted CLI contract
        run: python claude-review/claude_review.py --help