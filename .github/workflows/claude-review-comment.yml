name: Claude PR Review Comment

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: "Pull request URL in this repository"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate PR URL
        env:
          PR_URL: ${{ inputs.pr_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="$(
            python3 - "$PR_URL" "$REPOSITORY" <<'PY'
          import re
          import sys

          pr_url, repository = sys.argv[1:3]
          match = re.fullmatch(r"https://github\.com/([^/]+/[^/]+)/pull/([0-9]+)(?:[/?#].*)?", pr_url)
          if not match:
              raise SystemExit("expected a GitHub PR URL")
          if match.group(1).lower() != repository.lower():
              raise SystemExit("workflow token can only comment on PRs in this repository")
          print(match.group(2))
          PY
          )"
          test -n "$pr_number"

      - name: Generate and post structured review
        env:
          PR_URL: ${{ inputs.pr_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 agents/pr-reviewer/claude_review.py --pr "$PR_URL" --output review.md --post-comment
          test -s review.md
