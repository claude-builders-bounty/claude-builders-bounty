name: Destructive hook POSIX tests

on:
  push:
    paths:
      - ".github/workflows/destructive-hook-posix.yml"
      - "hooks/destructive-command-blocker/**"
  pull_request:
    paths:
      - ".github/workflows/destructive-hook-posix.yml"
      - "hooks/destructive-command-blocker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix-tests:
    name: POSIX installer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show runtime
        run: |
          uname -s
          bash --version
          node --version

      - name: Run destructive hook and installer tests
        run: bash hooks/destructive-command-blocker/test_block_destructive_bash.sh
