name: Test claude-review

on:
  pull_request:
    paths:
      - "agents/claude-review/**"
      - "claude-review"
      - ".github/workflows/test-claude-review.yml"
  push:
    paths:
      - "agents/claude-review/**"
      - "claude-review"
      - ".github/workflows/test-claude-review.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: |
          python3 -m unittest agents/claude-review/tests/test_claude_review.py -v
          test -x ./claude-review
          git diff --check
          if grep -rE 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor' agents/claude-review/ claude-review; then
            echo 'Forbidden agent attribution strings found in claude-review sources'
            exit 1
          fi
