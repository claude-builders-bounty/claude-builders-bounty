name: Test claude-review

on:
  pull_request:
    paths:
      - "agents/claude-review/**"
      - "claude-review"
      - ".github/workflows/test-claude-review.yml"
  push:
    branches:
      - main
    paths:
      - "agents/claude-review/**"
      - "claude-review"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python3 -m unittest agents/claude-review/tests/test_claude_review.py -v
