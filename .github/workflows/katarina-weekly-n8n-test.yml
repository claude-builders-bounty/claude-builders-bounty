name: Katarina n8n Weekly Workflow Tests
on:
  push:
    branches:
      - bounty/weekly-n8n-summary-20261015
    paths:
      - "submissions/katarina-n8n-weekly/**"
      - ".github/workflows/katarina-weekly-n8n-test.yml"
  pull_request:
    paths:
      - "submissions/katarina-n8n-weekly/**"
      - ".github/workflows/katarina-weekly-n8n-test.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate n8n workflow with mocked data
        run: node submissions/katarina-n8n-weekly/test_workflow.cjs
