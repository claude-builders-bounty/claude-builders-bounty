name: claude-template-tests

on:
  push:
    branches:
      - bounty-2-nextjs-sqlite-claude
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contract tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run template contract tests
        run: python -B -m unittest discover -s tests -v
