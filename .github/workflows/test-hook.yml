name: Test destructive-command hook

on:
  push:
    paths:
      - "block-destructive.py"
      - "tests/**"
      - ".github/workflows/test-hook.yml"
  pull_request:
    paths:
      - "block-destructive.py"
      - "tests/**"
      - ".github/workflows/test-hook.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
