name: Test Sovereign PR Review
on:
  pull_request:
    branches: [main]
  push:
    branches: [sovereign-pr-review-agent]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
