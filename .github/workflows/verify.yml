name: verify
on:
  push:
    branches: ['bounty-*']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax check
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r bash -n
      - name: python compile check
        run: find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 -r -n1 python3 -m py_compile
