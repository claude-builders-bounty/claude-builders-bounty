name: Test PreToolUse safety hook

on:
  pull_request:
    paths:
      - 'hooks/pre-tool-use-safety/**'
      - '.github/workflows/test-pre-tool-use-hook.yml'
  push:
    branches:
      - feat/pre-tool-use-safety-3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests
        run: bash hooks/pre-tool-use-safety/tests/test-hook.sh
