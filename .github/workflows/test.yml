name: Test destructive-command hook

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run hook tests
        run: python -m unittest discover -s tests -v
      - name: Compile hook
        run: python -m py_compile .claude/hooks/block_destructive.py
