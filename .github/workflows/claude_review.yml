name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install PyGithub openai

    - name: Run Claude Code Review
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CLAUDE_API_KEY: ${{ secrets.CLADE_API_KEY }}
      run: |
        python claude_review.py --pr ${{ github.event.pull_request.html_url }} --github-token $GITHUB_TOKEN --claude-api-key $CLAUDE_API_KEY

    - name: Post Comment
      uses: maroc81/act-codenotify@v1.1.0
      if: github.event_name == 'pull_request'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        message: |
          ## Claude Code Review
          ${{ steps.claude-review.outputs.result }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}