name: Test n8n Workflow
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: python3 -c "
import json
with open('weekly-dev-summary.json') as f:
    wf = json.load(f)
nodes = wf.get('nodes',[]) or (wf if isinstance(wf,list) else [])
print(f'Workflow has {len(nodes)} nodes')
names = [n.get('name','?') for n in nodes]
print(f'Nodes: {names}')
"
      - name: Check README
        run: |
          test -f n8n-workflow-readme.md && echo "README: $(wc -l < n8n-workflow-readme.md) lines"
          test -f execution-screenshot.svg && echo "Screenshot: present"
