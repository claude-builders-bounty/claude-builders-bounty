name: Katarina Hook Tests
on:
  push:
    paths:
      - "submissions/katarina-hook/**"
      - ".github/workflows/katarina-hook-validation.yml"
  pull_request:
    paths:
      - "submissions/katarina-hook/**"
      - ".github/workflows/katarina-hook-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run guard contract tests
        run: python -m unittest discover -s submissions/katarina-hook -v
