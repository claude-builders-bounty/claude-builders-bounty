name: Test PR Review Agent
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Test with sample diff
        run: |
          echo '--- a/src/app.tsx
          +++ b/src/app.tsx
          @@ -1 +1,3 @@
          -console.log("old");
          +// FIXME: implement error handling
          +console.log("debug");
          +export default function App() { return <div/>; }' > /tmp/test.diff
          python3 claude-review.py --pr-diff /tmp/test.diff
