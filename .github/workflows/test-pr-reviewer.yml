name: PR reviewer checks

on:
  pull_request:
    paths:
      - "bin/claude-review.mjs"
      - "package.json"
      - "test/**"
      - ".claude/agents/pr-reviewer.md"
      - "README-pr-reviewer.md"
      - ".github/workflows/claude-review.yml"
      - ".github/workflows/test-pr-reviewer.yml"
  push:
    paths:
      - "bin/claude-review.mjs"
      - "package.json"
      - "test/**"
      - ".claude/agents/pr-reviewer.md"
      - "README-pr-reviewer.md"
      - ".github/workflows/claude-review.yml"
      - ".github/workflows/test-pr-reviewer.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run checks
        run: npm run check

      - name: Check whitespace
        run: git diff --check
