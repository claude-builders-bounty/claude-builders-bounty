name: Test PR reviewer agent

on:
  push:
    branches:
      - codex/pr-reviewer-agent
  pull_request:
    paths:
      - "agents/pr-reviewer/**"
      - ".github/workflows/claude-review.yml"
      - ".github/workflows/test-pr-reviewer.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run reviewer tests
        working-directory: agents/pr-reviewer
        run: npm test
      - name: Syntax-check CLI
        working-directory: agents/pr-reviewer
        run: node --check bin/claude-review.mjs
