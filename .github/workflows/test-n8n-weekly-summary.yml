name: test-n8n-weekly-summary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'workflows/n8n-weekly-dev-summary/**'
      - '.github/workflows/test-n8n-weekly-summary.yml'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'workflows/n8n-weekly-dev-summary/**'
      - '.github/workflows/test-n8n-weekly-summary.yml'
  push:
    paths:
      - 'workflows/n8n-weekly-dev-summary/**'
      - '.github/workflows/test-n8n-weekly-summary.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate workflow JSON
        run: |
          set -o pipefail
          cd workflows/n8n-weekly-dev-summary
          npm test
          jq empty weekly-dev-summary.json
          if grep -rE 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor' .; then
            echo 'Forbidden agent attribution strings found in workflow sources'
            exit 1
          fi
          git -C ../.. fetch --depth=100 https://github.com/claude-builders-bounty/claude-builders-bounty.git main:refs/remotes/upstream/main
          if git -C ../.. log -1 --format='%B' | grep -qE '^(Co-authored-by: Cursor|Made-with: Cursor)|cursoragent@cursor\.com|^Made with Cursor'; then
            echo 'Forbidden agent attribution strings found in HEAD commit message'
            exit 1
          fi
          git -C ../.. diff --check
      - name: GitHub API integration test
        working-directory: workflows/n8n-weekly-dev-summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run test:github
      - name: Report commit status for upstream PR
        if: always()
        uses: actions/github-script@v7
        env:
          UPSTREAM_STATUS_TOKEN: ${{ secrets.UPSTREAM_STATUS_TOKEN }}
        with:
          github-token: ${{ secrets.UPSTREAM_STATUS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const upstream = { owner: 'claude-builders-bounty', repo: 'claude-builders-bounty' };
            const pr = context.payload.pull_request;
            let sha = pr?.head?.sha || context.sha;
            let owner = pr?.base?.repo?.owner?.login || upstream.owner;
            let repo = pr?.base?.repo?.name || upstream.repo;

            if (!pr && context.eventName === 'push') {
              const { data: pulls } = await github.rest.pulls.list({
                owner: upstream.owner,
                repo: upstream.repo,
                head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
                state: 'open',
                per_page: 1,
              });
              const openPr = pulls[0];
              if (openPr) {
                sha = openPr.head.sha;
                owner = openPr.base.repo.owner.login;
                repo = openPr.base.repo.name;
              }
            }

            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const payload = {
              owner,
              repo,
              sha,
              state,
              context: 'test-n8n-weekly-summary',
              description: state === 'success'
                ? 'Workflow validation and GitHub API tests passed'
                : 'Workflow validation or GitHub API tests failed',
              target_url: runUrl,
            };

            try {
              await github.rest.repos.createCommitStatus(payload);
            } catch (error) {
              core.warning(`Upstream status unavailable (${error.status}); reporting on fork commit.`);
              await github.rest.repos.createCommitStatus({
                ...payload,
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
              });
            }
