name: test-n8n-weekly-summary

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'workflows/n8n-weekly-dev-summary/**'
      - '.github/workflows/test-n8n-weekly-summary.yml'
  push:
    paths:
      - 'workflows/n8n-weekly-dev-summary/**'
      - '.github/workflows/test-n8n-weekly-summary.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate workflow JSON
        run: |
          node workflows/n8n-weekly-dev-summary/tests/validate-workflow.mjs
          node workflows/n8n-weekly-dev-summary/tests/collect-github-data.test.mjs
          jq empty workflows/n8n-weekly-dev-summary/weekly-dev-summary.json
          git diff --check
          if grep -rE 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor' workflows/n8n-weekly-dev-summary/; then
            echo 'Forbidden agent attribution strings found in workflow sources'
            exit 1
          fi
      - name: GitHub API integration test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node workflows/n8n-weekly-dev-summary/tests/github-fetch.test.mjs
