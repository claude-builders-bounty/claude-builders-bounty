name: test-n8n-weekly-summary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'workflows/n8n-weekly-dev-summary/**'
      - '.github/workflows/test-n8n-weekly-summary.yml'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'workflows/n8n-weekly-dev-summary/**'
      - '.github/workflows/test-n8n-weekly-summary.yml'
  push:
    paths:
      - 'workflows/n8n-weekly-dev-summary/**'
      - '.github/workflows/test-n8n-weekly-summary.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate workflow JSON
        run: |
          cd workflows/n8n-weekly-dev-summary
          npm test
          jq empty weekly-dev-summary.json
          if grep -rE 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor' .; then
            echo 'Forbidden agent attribution strings found in workflow sources'
            exit 1
          fi
          if git -C ../.. log origin/main..HEAD --format='%B' | grep -E 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor'; then
            echo 'Forbidden agent attribution strings found in commit messages'
            exit 1
          fi
          git -C ../.. diff --check
      - name: GitHub API integration test
        working-directory: workflows/n8n-weekly-dev-summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run test:github
