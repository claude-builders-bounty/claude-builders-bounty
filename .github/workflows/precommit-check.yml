name: Pre-commit Quality Check

on:
 pull_request:
 paths:
 - "**.py"

jobs:
 precommit-check:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 with:
 fetch-depth: 0

 - name: Set up Python
 uses: actions/setup-python@v5
 with:
 python-version: "3.12"

 - name: Install dependencies
 run: pip install isort ruff

 - name: Run pre-commit hook agent
 run: PRE_COMMIT_ALL_FILES=1 python precommit_hook/precommit_hook.py
 env:
 CI: true
 GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
