name: Validate CLAUDE.md Template
on:
  push:
    branches: [bounty-2-claude-md]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CLAUDE.md exists
        run: |
          test -f CLAUDE.md && echo "CLAUDE.md found: $(wc -l < CLAUDE.md) lines"
      - name: Check required sections
        run: |
          for section in "Stack" "Folder Structure" "Naming Conventions" "Component Patterns" "Auth Pattern" "Dev Commands" "Testing Requirements" "Git Conventions"; do
            grep -q "$section" CLAUDE.md && echo "Section present: $section" || echo "Missing: $section"
          done
