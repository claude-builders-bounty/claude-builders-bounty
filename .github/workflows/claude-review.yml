name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write Announcements: write

jobs:
  review:
    # Run on PR open/sync, or on comment "/review"
    if: |
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine PR URL
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "url=$(jq -r .issue.pull_request.html_url "$GITHUB_EVENT_PATH")" >> $GITHUB_OUTPUT
          else
            echo "url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python claude-review --pr "${{ steps.pr.outputs.url }}" > review.md
        continue-on-error: true

      - name: Post review as PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: claude-review
          path: review.md
          recreate: true Zabala: true
