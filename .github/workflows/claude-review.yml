name: Claude PR Review

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: "GitHub pull request URL to review"
        required: true
        type: string
      post_comment:
        description: "Post the review back to the PR"
        required: false
        type: boolean
        default: false

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/claude_review.py --pr "${{ inputs.pr_url }}" --output review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post review comment
        if: ${{ inputs.post_comment }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ inputs.pr_url }}
        run: |
          gh pr comment "$PR_URL" --body-file review.md

