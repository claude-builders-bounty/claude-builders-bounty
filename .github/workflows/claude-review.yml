name: Claude Code PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        working-directory: claude-reviewer
        run: python3 -m unittest discover -s . -p "test_*.py" -v

      - name: Run Claude PR review sub-agent
        working-directory: claude-reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional: static engine runs when unset
        run: |
          python3 claude_review.py \
            --pr "${{ github.event.pull_request.html_url }}" \
            --output review_comment.md \
            --post-comment

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review
          path: claude-reviewer/review_comment.md
          if-no-files-found: ignore
