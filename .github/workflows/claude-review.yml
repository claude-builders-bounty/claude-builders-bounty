name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: "Full GitHub PR URL to review (e.g. https://github.com/owner/repo/pull/123)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Claude Code PR Reviewer Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          chmod +x ./bin/claude-review
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_URL="${{ inputs.pr_url }}"
          else
            PR_URL="${{ github.event.pull_request.html_url }}"
          fi
          ./bin/claude-review --pr "$PR_URL" --output review-comment.md --post

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-pr-review
          path: review-comment.md
