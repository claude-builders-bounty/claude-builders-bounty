name: Claude PR Review

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: "GitHub pull request URL to review"
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine PR URL
        id: pr
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.pr_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ github.event.pull_request.html_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate structured review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node ./bin/claude-review.mjs --pr "${{ steps.pr.outputs.url }}" --output review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-review
          path: review.md
