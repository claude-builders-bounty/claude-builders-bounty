name: Claude PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: "GitHub pull request URL to review"
        required: true

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewer
        uses: actions/checkout@v4

      - name: Review pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.html_url }}
        run: node scripts/claude-review.js --pr "$PR_URL" --post
