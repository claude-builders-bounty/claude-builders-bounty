name: Claude structured PR review
on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: Full PR URL to review
        required: true
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x agents/claude-review/claude-review
          agents/claude-review/claude-review --pr "${{ inputs.pr_url }}"
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-review
          path: samples/reviews/
