name: Claude PR Review Agent

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: GitHub pull request URL to review
        required: true
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate agent
        run: npm run check
      - name: Generate review
        run: node bin/claude-review.js --pr "${{ inputs.pr_url }}" > review.md
      - name: Upload review
        uses: actions/upload-artifact@v5
        with:
          name: claude-pr-review
          path: review.md
