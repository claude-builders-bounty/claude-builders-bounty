name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_url:
        description: GitHub pull request URL to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reviewer
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate structured review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_PR_URL: ${{ github.event.pull_request.html_url }}
          MANUAL_PR_URL: ${{ github.event.inputs.pr_url }}
        run: |
          PR_URL="${MANUAL_PR_URL:-$EVENT_PR_URL}"
          node bin/claude-review.mjs --pr "$PR_URL" --output claude-review.md
          cat claude-review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_URL: ${{ github.event.pull_request.html_url }}
          MANUAL_PR_URL: ${{ github.event.inputs.pr_url }}
        run: |
          PR_URL="${MANUAL_PR_URL:-$EVENT_PR_URL}"
          gh pr comment "$PR_URL" --body-file claude-review.md
