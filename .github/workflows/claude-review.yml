name: Claude Code PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Claude PR Review Agent
        run: |
          python agents/pr-reviewer/reviewer.py --pr "${{ github.event.pull_request.html_url }}" > review.md
          cat review.md
