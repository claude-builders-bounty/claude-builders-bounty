name: Claude PR Review
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run claude-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          PR_URL="${{ github.event.issue.pull_request.url }}"
          if [ -z "$PR_URL" ]; then
            # If triggered by PR review event, use that PR
            PR_URL="${{ github.event.pull_request.html_url }}"
          fi
          python claude_review.py --pr "$PR_URL" --output review.md
          
          # Post as comment
          gh pr comment "$PR_URL" --body "$(cat review.md)"
