name: Claude PR Review

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: "Pull request URL to review"
        required: true
        type: string
      post_comment:
        description: "Post the review as a PR comment"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent
        run: pip install -e .

      - name: Generate structured review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.post_comment }}" = "true" ]; then
            claude-review --pr "${{ inputs.pr_url }}" --post-comment --output review.md
          else
            claude-review --pr "${{ inputs.pr_url }}" --output review.md
          fi

      - name: Add review to job summary
        run: cat review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-pr-review
          path: review.md
