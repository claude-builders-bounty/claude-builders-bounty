name: Katarina SaaS Template Tests
on:
  push:
    paths:
      - "submissions/katarina-saas-template/**"
      - ".github/workflows/katarina-saas-template-validation.yml"
  pull_request:
    paths:
      - "submissions/katarina-saas-template/**"
      - ".github/workflows/katarina-saas-template-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: submissions/katarina-saas-template/fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: SQLite migration integration tests
        run: python -m unittest discover -s tests -v
      - name: Install JS dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: TypeScript
        run: pnpm run typecheck
      - name: Next.js production build
        run: pnpm run build
