name: Validate weekly summary workflow

on:
  push:
    paths:
      - "weekly-github-summary.json"
      - "workflow_smoke_test.py"
      - ".github/workflows/validate-weekly-summary.yml"
  pull_request:
    paths:
      - "weekly-github-summary.json"
      - "workflow_smoke_test.py"
      - ".github/workflows/validate-weekly-summary.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate exported workflow JSON and connections
        run: |
          python3 -m json.tool weekly-github-summary.json >/dev/null
          python3 workflow_smoke_test.py
