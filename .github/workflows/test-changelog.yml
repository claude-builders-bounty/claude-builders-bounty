name: test-changelog

on:
  pull_request:
    paths:
      - 'changelog.sh'
      - 'skills/generate-changelog/**'
      - '.github/workflows/test-changelog.yml'
  push:
    paths:
      - 'changelog.sh'
      - 'skills/generate-changelog/**'
      - '.github/workflows/test-changelog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - name: Run changelog regression tests
        run: |
          bash skills/generate-changelog/tests/test_changelog.sh
          preview="$(mktemp)"
          sample="$(mktemp)"
          bash changelog.sh --preview 2>/dev/null >"$preview"
          preview_body="${preview}.body"
          sample_body="${sample}.body"
          grep -v '^## \[.*\] - ' "$preview" >"$preview_body"
          if git diff-tree --no-commit-id --name-only -r HEAD \
            | grep -q '^skills/generate-changelog/samples/CHANGELOG\.sample\.md$'; then
            head_hash="$(git rev-parse --short HEAD)"
            grep -v "(${head_hash})" "$preview_body" >"${preview_body}.trim"
            mv "${preview_body}.trim" "$preview_body"
          fi
          grep -v '^## \[.*\] - ' skills/generate-changelog/samples/CHANGELOG.sample.md >"$sample_body"
          if ! diff -u "$sample_body" "$preview_body"; then
            echo 'CHANGELOG.sample.md is stale; regenerate with: bash changelog.sh --preview > skills/generate-changelog/samples/CHANGELOG.sample.md'
            exit 1
          fi
          git diff --check
          if grep -rE 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor' skills/generate-changelog/; then
            echo 'Forbidden agent attribution strings found in changelog sources'
            exit 1
          fi
          if git log -1 --format='%B' | grep -qE '^Co-authored-by: Cursor <cursoragent@cursor\.com>$|^Made with Cursor$'; then
            echo 'Forbidden agent attribution trailer found in HEAD commit message'
            exit 1
          fi
          if git log -1 --format='%ae%n%ce' | grep -qF 'cursoragent@cursor.com'; then
            echo 'Forbidden agent attribution email found in HEAD commit'
            exit 1
          fi
