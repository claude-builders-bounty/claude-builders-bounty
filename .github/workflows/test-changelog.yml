name: Test changelog generator

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'skills/generate-changelog/**'
      - '.github/workflows/test-changelog.yml'
  push:
    branches:
      - feat/generate-changelog-isaaclins

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run changelog tests
        run: bash scripts/test-changelog.sh
