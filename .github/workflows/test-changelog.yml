name: test-changelog

on:
  pull_request:
    paths:
      - 'changelog.sh'
      - 'skills/generate-changelog/**'
      - '.github/workflows/test-changelog.yml'
  push:
    paths:
      - 'changelog.sh'
      - 'skills/generate-changelog/**'
      - '.github/workflows/test-changelog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
      - name: Run changelog CI validation
        run: bash skills/generate-changelog/tests/run-ci-checks.sh
