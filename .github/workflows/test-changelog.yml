name: test-changelog

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'skills/generate-changelog/**'
      - '.github/workflows/test-changelog.yml'
  push:
    paths:
      - 'skills/generate-changelog/**'
      - '.github/workflows/test-changelog.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - name: Run changelog regression tests
        run: |
          bash skills/generate-changelog/tests/test_changelog.sh
          git diff --check
          if grep -rE 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor' skills/generate-changelog/; then
            echo 'Forbidden agent attribution strings found in changelog sources'
            exit 1
          fi
          if git log --format='%B' -20 | grep -qE 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor'; then
            echo 'Forbidden agent attribution strings found in recent commit messages'
            exit 1
          fi
