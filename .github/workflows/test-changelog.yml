name: test-changelog

on:
  pull_request:
    paths:
      - 'skills/generate-changelog/**'
      - '.github/workflows/test-changelog.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/generate-changelog/**'
      - '.github/workflows/test-changelog.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run changelog regression tests
        run: bash skills/generate-changelog/tests/test_changelog.sh
