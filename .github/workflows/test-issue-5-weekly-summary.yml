name: Test issue 5 weekly summary

on:
  pull_request:
    paths:
      - ".github/workflows/test-issue-5-weekly-summary.yml"
      - "workflows/issue-5-weekly-dev-summary/**"
  push:
    paths:
      - ".github/workflows/test-issue-5-weekly-summary.yml"
      - "workflows/issue-5-weekly-dev-summary/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate workflow export
        run: python workflows/issue-5-weekly-dev-summary/validate_workflow.py

      - name: Run deterministic smoke test
        run: python workflows/issue-5-weekly-dev-summary/smoke_greenfield.py

      - name: Test exported Discord transformation without HTTP calls
        run: node --test workflows/issue-5-weekly-dev-summary/test_delivery.mjs

      - name: Test owner-local evidence checker with synthetic fixtures
        run: python workflows/issue-5-weekly-dev-summary/test_execution_evidence.py

      - name: Install isolated n8n expression resolver
        run: npm install --prefix "$RUNNER_TEMP/issue-5-n8n-expression-check" --ignore-scripts --no-audit --no-fund --save-exact n8n-workflow@2.32.1

      - name: Run real n8n resolver checks without HTTP calls
        run: node workflows/issue-5-weekly-dev-summary/test_n8n_expressions.mjs "$RUNNER_TEMP/issue-5-n8n-expression-check"

      - name: Check whitespace
        run: git diff --check
