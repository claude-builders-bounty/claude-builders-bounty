name: template-smoke
on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'template-verification.md'
      - '.github/workflows/template-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create Next.js 15 project
        run: npx create-next-app@15 template-smoke --ts --eslint --app --src-dir --use-npm --no-tailwind --import-alias "@/*" --yes
      - name: Install documented SQLite dependency
        working-directory: template-smoke
        run: npm install better-sqlite3
      - name: Verify template guidance is present
        run: test -s CLAUDE.md
