name: Katarina Changelog Tests
on:
  push:
    paths:
      - "submissions/katarina-changelog/**"
      - ".github/workflows/katarina-changelog-validation.yml"
  pull_request:
    paths:
      - "submissions/katarina-changelog/**"
      - ".github/workflows/katarina-changelog-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python and Bash tests
        run: |
          python -m unittest discover -s submissions/katarina-changelog -v
          bash -n submissions/katarina-changelog/changelog.sh
