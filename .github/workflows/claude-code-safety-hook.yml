name: Claude Code safety hook

on:
  push:
    paths:
      - examples/claude-code-safety-hook/**
      - .github/workflows/claude-code-safety-hook.yml
  pull_request:
    paths:
      - examples/claude-code-safety-hook/**
      - .github/workflows/claude-code-safety-hook.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/claude-code-safety-hook
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Unit and installer regressions
        run: python3 -m unittest -v test_command_guard
      - name: Install pinned Claude runtime without lifecycle scripts
        env:
          CLAUDE_INSTALL_DIR: ${{ runner.temp }}/claude-hook-runtime
        run: |
          npm install --prefix "$CLAUDE_INSTALL_DIR" --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.312
          node <<'NODE' >> "$GITHUB_ENV"
          const path = require('node:path');
          const pkg = `@anthropic-ai/claude-code-${process.platform}-${process.arch}/package.json`;
          const manifest = require.resolve(pkg, {paths: [process.env.CLAUDE_INSTALL_DIR]});
          console.log(`CLAUDE_BINARY=${path.join(path.dirname(manifest), 'claude')}`);
          NODE
      - name: Real CLI with local synthetic model responses
        run: python3 -m unittest -v test_claude_runtime
