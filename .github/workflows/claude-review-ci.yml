name: Claude review offline CI
on:
  pull_request:
    paths:
      - "agents/pr-review/**"
      - ".claude/agents/pr-reviewer.md"
      - ".github/workflows/claude-review-ci.yml"
  push:
    paths:
      - "agents/pr-review/**"
      - ".claude/agents/pr-reviewer.md"
      - ".github/workflows/claude-review-ci.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: agents/pr-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q claude_review.py tests scripts
      - run: python scripts/reproduce_examples.py --check
      - run: python -m pip wheel --no-deps . -w dist
