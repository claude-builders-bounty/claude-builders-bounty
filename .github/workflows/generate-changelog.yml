name: generate-changelog CI

on:
  push:
    branches: [main, master]
    paths:
      - 'skills/generate-changelog/**'
  pull_request:
    paths:
      - 'skills/generate-changelog/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/generate-changelog

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run test suite
        run: |
          bash tests/test.sh

      - name: Smoke test — generate sample changelog
        run: |
          bash changelog.sh --dry-run

      - name: Smoke test — JSON format
        run: |
          bash changelog.sh --format json --dry-run

      - name: Smoke test — custom since
        run: |
          # Find first commit to use as --since target
          FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
          bash changelog.sh --since "$FIRST_COMMIT" --dry-run

      - name: Verify SKILL.md frontmatter
        run: |
          head -5 SKILL.md | grep -q "^---$" && echo "SKILL.md has frontmatter" || (echo "SKILL.md missing frontmatter" && exit 1)
          grep -q "^name:" SKILL.md && echo "SKILL.md has name" || (echo "SKILL.md missing name" && exit 1)
          grep -q "^description:" SKILL.md && echo "SKILL.md has description" || (echo "SKILL.md missing description" && exit 1)
