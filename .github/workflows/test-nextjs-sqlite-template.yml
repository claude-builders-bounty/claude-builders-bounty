name: test-nextjs-sqlite-template

on:
  pull_request:
    paths:
      - 'templates/nextjs-sqlite-saas/**'
  push:
    branches:
      - main
    paths:
      - 'templates/nextjs-sqlite-saas/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate CLAUDE.md template structure
        run: node templates/nextjs-sqlite-saas/validate-template.mjs
      - name: Greenfield smoke test
        run: bash templates/nextjs-sqlite-saas/tests/smoke-greenfield.sh
