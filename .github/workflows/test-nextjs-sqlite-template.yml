name: test-nextjs-sqlite-template

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'templates/nextjs-sqlite-saas/**'
      - 'Makefile'
      - 'package.json'
      - '.gitignore'
      - 'scripts/**'
      - '.github/workflows/test-nextjs-sqlite-template.yml'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'templates/nextjs-sqlite-saas/**'
      - 'Makefile'
      - 'package.json'
      - '.gitignore'
      - 'scripts/**'
      - '.github/workflows/test-nextjs-sqlite-template.yml'
  push:
    paths:
      - 'templates/nextjs-sqlite-saas/**'
      - 'Makefile'
      - 'package.json'
      - '.gitignore'
      - 'scripts/**'
      - '.github/workflows/test-nextjs-sqlite-template.yml'
  workflow_dispatch:

# Read-only workflow — validation steps only, no privileged Actions or secret tokens.
permissions:
  contents: read

concurrency:
  group: test-nextjs-sqlite-template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Verify secret token protection
        run: node templates/nextjs-sqlite-saas/tests/check-secret-tokens.mjs
      - name: Validate reference app env vars
        run: node scripts/validate-reference-env.mjs
        env:
          DATABASE_URL: ":memory:"
          SESSION_SECRET: "ci-session-secret-32-chars-minimum"
      - name: Run database migration tests
        run: |
          cd templates/nextjs-sqlite-saas/reference
          pnpm install --frozen-lockfile 2>/dev/null || pnpm install
          pnpm exec vitest run tests/db/migrations.test.ts
        env:
          DATABASE_URL: ":memory:"
          SESSION_SECRET: "ci-session-secret-32-chars-minimum"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      - name: Run template CI validation
        run: npm test
