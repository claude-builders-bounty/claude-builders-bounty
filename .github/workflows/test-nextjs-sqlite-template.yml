name: test-nextjs-sqlite-template

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'templates/nextjs-sqlite-saas/**'
      - '.github/workflows/test-nextjs-sqlite-template.yml'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'templates/nextjs-sqlite-saas/**'
      - '.github/workflows/test-nextjs-sqlite-template.yml'
  push:
    paths:
      - 'templates/nextjs-sqlite-saas/**'
      - '.github/workflows/test-nextjs-sqlite-template.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate CLAUDE.md template structure
        run: node templates/nextjs-sqlite-saas/validate-template.mjs
      - name: Greenfield smoke test
        run: bash templates/nextjs-sqlite-saas/tests/smoke-greenfield.sh
      - name: Reject forbidden attribution strings
        run: |
          set -o pipefail
          git diff --check
          if grep -rE 'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor|NEED_CURSOR_HELP' \
              templates/nextjs-sqlite-saas/; then
            echo 'Forbidden agent attribution strings found in template sources'
            exit 1
          fi
          git fetch --depth=100 https://github.com/claude-builders-bounty/claude-builders-bounty.git main:refs/remotes/upstream/main
          if git log upstream/main..HEAD --format='%B' -- templates/nextjs-sqlite-saas/ | grep -qE \
              'cursoragent@cursor\.com|Made with Cursor|Co-authored-by: Cursor|NEED_CURSOR_HELP'; then
            echo 'Forbidden agent attribution strings found in template commit messages'
            exit 1
          fi
