name: Next.js SQLite template checks

on:
  pull_request:
    paths:
      - "templates/nextjs-sqlite-saas/**"
      - ".github/workflows/test-nextjs-sqlite-template.yml"
  push:
    paths:
      - "templates/nextjs-sqlite-saas/**"
      - ".github/workflows/test-nextjs-sqlite-template.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate template contract
        run: node templates/nextjs-sqlite-saas/validate-template.mjs

      - name: Validate greenfield template contract
        shell: bash
        run: bash templates/nextjs-sqlite-saas/tests/validate-template-contract.sh

      - name: Test fixture integrity evidence
        run: node --test templates/nextjs-sqlite-saas/tests/fixture-integrity.test.mjs

      - name: Check whitespace
        run: git diff --check
