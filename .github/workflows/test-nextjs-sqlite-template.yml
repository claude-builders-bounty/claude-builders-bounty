name: test-nextjs-sqlite-template

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'templates/nextjs-sqlite-saas/**'
      - 'Makefile'
      - 'package.json'
      - '.github/workflows/test-nextjs-sqlite-template.yml'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'templates/nextjs-sqlite-saas/**'
      - 'Makefile'
      - 'package.json'
      - '.github/workflows/test-nextjs-sqlite-template.yml'
  push:
    paths:
      - 'templates/nextjs-sqlite-saas/**'
      - 'Makefile'
      - 'package.json'
      - '.github/workflows/test-nextjs-sqlite-template.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-nextjs-sqlite-template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Run template CI validation
        run: bash templates/nextjs-sqlite-saas/tests/run-ci-checks.sh
