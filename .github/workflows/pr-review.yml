name: PR Review Bot
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          echo "lines=$(wc -l < /tmp/pr.diff)" >> $GITHUB_OUTPUT

      - name: Generate review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            You are a senior code reviewer. Review this PR diff and produce
            a structured Markdown comment with:
            
            1. **Summary** — 2-3 sentences about what this PR does
            2. **Identified Risks** — bugs, security issues, edge cases
            3. **Improvement Suggestions** — specific, actionable
            4. **Nitpicks** — style, naming, formatting
            
            Be concise. Focus on real issues, not minor style preferences.
            Rate overall quality: 🟢 GOOD / 🟡 OK / 🔴 NEEDS WORK
            
            DIFF:
            ```
            $(cat /tmp/pr.diff | head -5000)
            ```
          model: claude-sonnet-4-20250514
          max_tokens: 2000

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = process.env.REVIEW_OUTPUT;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 PR Review\n\n${review}`
            });
