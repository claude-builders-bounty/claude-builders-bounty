name: PR Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run PR Review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python claude-review.py --pr "https://github.com/${{ github.repository }}/pull/${{ github.event.number }}" --token "${{ github.token }}"
