name: PR Review
on: [pull_request]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL https://raw.githubusercontent.com/gtx20060124-bot/claude-builders-bounty/feature/pr-reviewer-v2/claude-review -o claude-review
          chmod +x claude-review
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} ./claude-review --pr "${{ github.event.pull_request.html_url }}" --publish
