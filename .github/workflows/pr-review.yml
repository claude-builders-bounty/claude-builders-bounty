# GitHub Action workflow — automated structured PR reviews
# Place at .github/workflows/pr-review.yml

name: PR Review Agent
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install agent code
        run: |
          mkdir -p .github/actions/pr-review-agent
          cp -r agents/pr-review/* .github/actions/pr-review-agent/
      
      - name: Run PR Review
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/actions/pr-review-agent/review.py \
            --repo ${{ github.repository }} \
            --local ${{ github.event.pull_request.number }} \
            --output /tmp/pr-review.md
      
      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pr-review.md', 'utf8');
            const { owner, repo } = context.repo;
            // Check if we already left a review
            const comments = await github.rest.issues.listComments({
              issue_number: ${{ github.event.pull_request.number }},
              owner, repo
            });
            const existing = comments.data.find(c => 
              c.user.type === 'Bot' && c.body.includes('PR Review by Claude Code Agent')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner, repo,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: ${{ github.event.pull_request.number }},
                owner, repo,
                body: body
              });
            }
