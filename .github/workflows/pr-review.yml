name: PR Review Agent
on:
  issue_comment:
    types: [created]
jobs:
  review:
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/opire try' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python pr_review_agent.py --pr ${{ github.event.issue.pull_request.html_url }}
