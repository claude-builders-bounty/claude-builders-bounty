name: Open-Reviewer
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: bash open-reviewer.sh --pr "${{ github.event.pull_request.html_url }}" --output review
      - name: Post
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = fs.readFileSync('review.md','utf8');
            github.rest.issues.createComment({issue_number:context.issue.number,owner:context.repo.owner,repo:context.repo.repo,body:r});
