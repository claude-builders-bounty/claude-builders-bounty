name: Claude PR Review Comment

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: GitHub pull request URL to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and post structured review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python agents/pr-reviewer/claude_review.py --pr "${{ inputs.pr_url }}" --post-comment
