name: Claude PR Review

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: GitHub pull request URL to review
        required: true
        type: string
      model:
        description: Optional Claude model alias or name
        required: false
        default: sonnet
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate structured PR review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ inputs.pr_url }}
          MODEL: ${{ inputs.model }}
        run: |
          python3 agents/claude-pr-review/claude_review.py \
            --pr "$PR_URL" \
            --model "$MODEL" \
            --output claude-pr-review.md

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-pr-review
          path: claude-pr-review.md
