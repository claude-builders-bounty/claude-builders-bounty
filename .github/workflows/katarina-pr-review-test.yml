name: Katarina PR Reviewer Offline Tests
on:
  pull_request:
    paths:
      - "submissions/katarina-pr-review/**"
      - ".github/workflows/katarina-pr-review-test.yml"
  push:
    branches:
      - "bounty/pr-review-agent-20261015"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run offline tests
        run: |
          python3 -m py_compile submissions/katarina-pr-review/review_pr.py
          python3 -m unittest discover -s submissions/katarina-pr-review -p "test_review_pr.py" -v
