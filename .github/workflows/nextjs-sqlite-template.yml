name: Next.js SQLite Template

on:
  pull_request:
    paths:
      - "templates/nextjs-sqlite-saas/**"
      - ".github/workflows/nextjs-sqlite-template.yml"
  push:
    paths:
      - "templates/nextjs-sqlite-saas/**"
      - ".github/workflows/nextjs-sqlite-template.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run template acceptance check
        run: python3 templates/nextjs-sqlite-saas/validate_template.py

      - name: Run greenfield smoke check
        run: python3 templates/nextjs-sqlite-saas/smoke_greenfield.py

      - name: Compile validator
        run: |
          python3 -m py_compile templates/nextjs-sqlite-saas/validate_template.py
          python3 -m py_compile templates/nextjs-sqlite-saas/smoke_greenfield.py

      - name: Check whitespace in current diff
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi
