name: n8n Weekly Dev Summary

on:
  pull_request:
    paths:
      - "workflows/n8n-weekly-dev-summary.json"
      - "workflows/README.md"
      - "scripts/validate_n8n_workflow.py"
      - "tests/test_n8n_workflow.py"
      - ".github/workflows/n8n-weekly-dev-summary.yml"
  push:
    paths:
      - "workflows/n8n-weekly-dev-summary.json"
      - "workflows/README.md"
      - "scripts/validate_n8n_workflow.py"
      - "tests/test_n8n_workflow.py"
      - ".github/workflows/n8n-weekly-dev-summary.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run workflow tests
        run: python -m unittest tests/test_n8n_workflow.py -v

      - name: Compile validator and tests
        run: python -m py_compile scripts/validate_n8n_workflow.py tests/test_n8n_workflow.py

      - name: Run static workflow validator
        run: python scripts/validate_n8n_workflow.py

      - name: Check whitespace
        run: git diff --check
