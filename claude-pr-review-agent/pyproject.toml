[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pr-review-agent"
version = "0.1.0"
description = "Claude Code PR review CLI that produces structured Markdown comments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claude-review = "claude_pr_review_agent.cli:main"

[tool.setuptools.packages.find]
include = ["claude_pr_review_agent*"]
