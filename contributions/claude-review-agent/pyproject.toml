[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-review"
version = "1.0.0"
description = "AI-powered PR review agent using Claude"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.39.0",
    "requests>=2.31.0",
    "click>=8.1.0",
]

[project.scripts]
claude-review = "claude_review.cli:main"

[tool.setuptools.packages.find]
include = ["claude_review*"]
