# 闲鱼自动化配置文件
# 复制为 config.yaml 并填入实际值

# 账号配置
account:
  cookie: ""  # 从浏览器复制完整 cookie 字符串
  user_id: ""  # 闲鱼用户 ID
  nickname: "" # 闲鱼昵称
  
# 运行配置
runtime:
  check_interval: 300          # 轮询间隔(秒)，默认5分钟
  max_retries: 3               # 失败重试次数
  request_timeout: 30          # 请求超时(秒)
  rate_limit_delay: 5          # 请求间隔(秒)，防风控
  
# 业务配置
business:
  auto_reply: true             # 自动回复
  auto_delivery: true          # 自动发货
  auto_listing: true           # 定期上架/续期
  max_price_adjust: 0.15       # 最大调价幅度 15%
  
# 风控设置
safety:
  max_daily_actions: 100       # 每日最大操作数
  min_action_interval: 3       # 最小操作间隔(秒)
  cooldown_on_risk: 3600       # 风控触发冷却时间(秒)
  daily_action_limit: 50       # 每日最大操作数
  
# 商品配置
products:
  - id: "OLLAMA-001"
    name: "Ollama本地部署大模型"
    price: 199
    category: "电脑软件/虚拟物品"
    auto_relist: true
    relist_interval: 86400     # 24小时重新上架
    keywords:
      - "Ollama本地部署"
      - "大模型部署"
      - "Ollama部署"
      - "本地大模型"
    delivery:
      type: "auto"
      content_template: "olmama_delivery.txt"
      
# 回复模板
reply_templates:
  greeting: |
    亲，您好！感谢咨询~
  price_inquiry: |
    亲，这个价格已经是最优惠了，包含远程协助部署和30天答疑哦~
  delivery_info: |
    亲，拍下后自动发货，网盘链接会发到订单里，请查收~
  after_sale: |
    亲，有问题随时找我，48小时内必回复，远程协助包教会~

# 通知设置
notifications:
  enable_wechat: false
  wechat_webhook: ""
  enable_email: false
  email_smtp: ""
  email_to: ""

# 代理设置(可选)
proxy:
  enabled: false
  http: ""
  https: ""