# Xianyu Pipeline - Systemd User Service Unit
# For WSL2 / Linux systemd user mode deployment

# ============================================================
# Delivery Service (Phase 4 - Long-running)
# ============================================================
# File: ~/.config/systemd/user/xianyu-pipeline.service
# Enable: systemctl --user enable --now xianyu-pipeline.service

[Unit]
Description=Xianyu Virtual Goods Pipeline - Delivery Service
Documentation=https://github.com/your-repo/xianyu_pipeline
After=network.target
Wants=network.target

[Service]
Type=simple
WorkingDirectory=%h/.hermes/python/xianyu_pipeline
Environment=PYTHONUNBUFFERED=1
Environment=TZ=Asia/Shanghai
EnvironmentFile=%h/.hermes/python/xianyu_pipeline/config/.env
ExecStart=%h/.hermes/python/xianyu_pipeline/.venv/bin/python main.py deliver --mode standalone
Restart=on-failure
RestartSec=30
RestartPreventExitStatus=0
StandardOutput=journal
StandardError=journal
SyslogIdentifier=xianyu-pipeline

# Resource limits (adjust based on available memory)
MemoryLimit=2G
CPUQuota=200%

# Security hardening
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=%h/.hermes/python/xianyu_pipeline/data %h/.hermes/python/xianyu_pipeline/logs %h/.hermes/python/xianyu_pipeline/output %h/.hermes/python/xianyu_pipeline/resources

[Install]
WantedBy=default.target

# ============================================================
# Scheduler Timer (Phase 1-3 - Daily Cron)
# ============================================================
# File: ~/.config/systemd/user/xianyu-pipeline-scheduler.timer
# Enable: systemctl --user enable --now xianyu-pipeline-scheduler.timer

[Unit]
Description=Daily Xianyu Pipeline Scheduler (Phase 1-3)
Requires=xianyu-pipeline-scheduler.service

[Timer]
OnCalendar=*-*-* 02:00:00
Persistent=true
RandomizedDelaySec=15min
AccuracySec=1min

[Install]
WantedBy=timers.target

# ============================================================
# Scheduler Service (One-shot)
# ============================================================
# File: ~/.config/systemd/user/xianyu-pipeline-scheduler.service

[Unit]
Description=Xianyu Pipeline Scheduler - Run Phase 1-3
After=network.target

[Service]
Type=oneshot
WorkingDirectory=%h/.hermes/python/xianyu_pipeline
Environment=PYTHONUNBUFFERED=1
Environment=TZ=Asia/Shanghai
EnvironmentFile=%h/.hermes/python/xianyu_pipeline/config/.env
ExecStart=%h/.hermes/python/xianyu_pipeline/.venv/bin/python scripts/scheduler.py
StandardOutput=journal
StandardError=journal
SyslogIdentifier=xianyu-pipeline-scheduler

# Resource limits for one-shot
MemoryLimit=4G
CPUQuota=300%

[Install]
WantedBy=multi-user.target

# ============================================================
# Cookie Refresh Service (Optional - Weekly)
# ============================================================
# File: ~/.config/systemd/user/xianyu-cookie-refresh.service

[Unit]
Description=Xianyu Cookie Refresh via Playwright
After=network.target

[Service]
Type=oneshot
WorkingDirectory=%h/.hermes/python/xianyu_pipeline
Environment=PYTHONUNBUFFERED=1
Environment=TZ=Asia/Shanghai
EnvironmentFile=%h/.hermes/python/xianyu_pipeline/config/.env
ExecStart=%h/.hermes/python/xianyu_pipeline/.venv/bin/python scripts/cookie_refresh.py
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=multi-user.target

# ============================================================
# Cookie Refresh Timer (Weekly)
# ============================================================
# File: ~/.config/systemd/user/xianyu-cookie-refresh.timer

[Unit]
Description=Weekly Xianyu Cookie Refresh
Requires=xianyu-cookie-refresh.service

[Timer]
OnCalendar=weekly
Persistent=true
RandomizedDelaySec=1h

[Install]
WantedBy=timers.target

# ============================================================
# Installation Commands
# ============================================================

# 1. Enable user lingering (required for user services to run without login)
# loginctl enable-linger $USER

# 2. Create service directories
# mkdir -p ~/.config/systemd/user

# 3. Copy service files to ~/.config/systemd/user/

# 4. Reload systemd user daemon
# systemctl --user daemon-reload

# 5. Enable and start delivery service
# systemctl --user enable --now xianyu-pipeline.service

# 6. Enable and start scheduler timer
# systemctl --user enable --now xianyu-pipeline-scheduler.timer

# 7. (Optional) Enable cookie refresh timer
# systemctl --user enable --now xianyu-cookie-refresh.timer

# 8. Check status
# systemctl --user status xianyu-pipeline.service
# systemctl --user status xianyu-pipeline-scheduler.timer

# 9. View logs
# journalctl --user -u xianyu-pipeline -f
# journalctl --user -u xianyu-pipeline-scheduler -f

# ============================================================
# WSL2 Specific Configuration
# ============================================================

# /etc/wsl.conf (requires sudo)
# [boot]
# systemd=true

# After editing wsl.conf, restart WSL:
# wsl --shutdown (from PowerShell)
# Then restart Ubuntu

# ============================================================
# Log Rotation (journald)
# ============================================================

# /etc/systemd/journald.conf (system-wide, requires sudo)
# [Journal]
# SystemMaxUse=500M
# SystemMaxFileSize=50M
# MaxRetentionSec=30day
# Compress=yes

# Restart: sudo systemctl restart systemd-journald