name: "Claude PR Review"
description: "Review PRs with Claude and post structured feedback"

inputs:
  anthropic_api_key:
    description: "Anthropic API key"
    required: true

runs:
  using: "composite"
  steps:
    - name: Review PR
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ github.token }}
      run: |
        chmod +x ${{ github.action_path }}/claude-review.sh
        REVIEW=$(${{ github.action_path }}/claude-review.sh --pr "${{ github.event.pull_request.html_url }}")
        gh pr comment "${{ github.event.pull_request.number }}" --body "$REVIEW"
