name: Structured PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run structured PR review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          chmod +x structured-pr-reviewer/claude-review
          structured-pr-reviewer/claude-review --pr "$PR_URL" --output review.md
          gh pr comment "$PR_URL" --body-file review.md
