name: "Claude Code PR Reviewer"\ndescription: "AI-powered PR review agent that analyzes diffs and posts structured comments."\nauthor: "Bai Ze (Project Tomahawk)"\ninputs:\n  pr_url:\n    description: "URL of the pull request to review"\n    required: true\n    default: "${{ github.event.pull_request.html_url }}"\n  github_token:\n    description: "GitHub token for API access"\n    required: true\n    default: "${{ github.token }}"\nruns:\n  using: "composite"\n  steps:\n    - name: "Checkout code"\n      uses: actions/checkout@v4\n    - name: "Set up Python"\n      uses: actions/setup-python@v5\n      with:\n        python-version: "3.x"\n    - name: "Install dependencies"\n      run: pip install requests\n      shell: bash\n    - name: "Run Claude Reviewer"\n      run: python claude_review_agent/main.py --pr ${{ inputs.pr_url }} --token ${{ inputs.github_token }} --comment\n      shell: bash
