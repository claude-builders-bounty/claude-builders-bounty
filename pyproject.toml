[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-review-bounty-agent"
version = "0.1.0"
description = "Dependency-free structured GitHub pull-request reviewer"
requires-python = ">=3.10"

[project.scripts]
claude-review = "claude_review:main"

[tool.setuptools]
py-modules = ["claude_review"]
package-dir = {"" = "agents/claude-review"}
