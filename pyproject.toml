[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-review"
version = "0.1.0"
description = "Claude Code PR review agent with structured Markdown output"
requires-python = ">=3.10"
dependencies = ["requests", "anthropic", "click"]

[project.scripts]
claude-review = "claude_review.cli:main"

[tool.setuptools.packages.find]
include = ["claude_review*"]
