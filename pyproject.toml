[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-review"
version = "1.0.0"
description = "Aletheia PR Reviewer Agent — Community Claude Code Bounty"
readme = "README_AGENT.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
claude-review = "claude_review:main"
