[project]
name = "claude-pr-review-agent"
version = "0.1.0"
description = "CLI and GitHub Action helper that turns a GitHub PR diff into a structured Markdown review comment."
readme = "PR-REVIEW-README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Claude Builders Bounty Contributor" }]

[project.scripts]
claude-review = "claude_review:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["claude_review"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
