[project]
name = "claude-review"
version = "0.1.0"
description = "CLI agent that reviews a GitHub pull request diff and returns a structured Markdown comment."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
claude-review = "claude_review.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["claude_review"]
