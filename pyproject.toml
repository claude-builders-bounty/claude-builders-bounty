[project]
name = "claude-review"
version = "0.1.0"
description = "Claude Code sub-agent that reviews a GitHub PR and posts a structured Markdown comment (LLM-powered semantic review)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claude-review = "claude_review.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claude_review*"]
