[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-review"
version = "1.0.0"
description = "Claude Code sub-agent that reviews a GitHub PR and posts a structured comment"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "jefrianus01" }]
keywords = ["claude", "code-review", "github", "pr-review", "agent"]

[project.scripts]
claude-review = "claude_review.cli:main"

[tool.setuptools.packages.find]
include = ["claude_review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]