[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pr-review-agent"
version = "0.1.0"
description = "Read-only structured pull-request reviews powered by Claude Code"
requires-python = ">=3.9"

[project.scripts]
claude-review = "claude_review:main"
