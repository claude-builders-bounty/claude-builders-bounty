[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_backend"

[project]
name = "claude-review"
version = "0.1.0"
description = "Claude Code sub-agent that reviews a PR and posts a structured Markdown comment."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
claude-review = "claude_review.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_review*"]
