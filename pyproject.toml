[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pr-reviewer"
version = "0.1.0"
description = "CLI agent that reviews GitHub pull requests and emits structured Markdown."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "mz13stars-cpu"}]
keywords = ["claude", "pull-request", "code-review", "github", "agent"]

[project.scripts]
claude-review = "claude_review.cli:main"
