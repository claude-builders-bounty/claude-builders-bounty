[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-review"
version = "0.1.0"
description = "A Claude Code CLI that reviews GitHub pull requests into structured Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Claude Builders Bounty contributor"}]
dependencies = []

[project.scripts]
claude-review = "claude_review:main"

[tool.setuptools]
py-modules = ["claude_review"]
