[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pr-reviewer"
version = "0.1.0"
description = "Claude Code PR review helper with structured Markdown output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Claude Builders Bounty contributors" }]
dependencies = []

[project.scripts]
claude-review = "claude_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

