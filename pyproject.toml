[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-builders-bounty"
version = "0.1.0"
description = "Claude Code builder bounty utilities"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[project.scripts]
claude-review = "claude_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
