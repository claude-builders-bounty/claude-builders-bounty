name: PR Review by Claude Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude PR Review
        id: claude_review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          REVIEW_OUTPUT="/tmp/pr-review-${{ github.event.pull_request.number }}.md"
          bash <(curl -sfL https://raw.githubusercontent.com/claude-builders-bounty/claude-builders-bounty/main/skills/pr-reviewer-agent/claude-review.sh) \
            --pr "${{ github.event.pull_request.html_url }}" \
            --output "$REVIEW_OUTPUT" \
            2>&1 | tee /tmp/claude-review-log.txt

          echo "review_file=$REVIEW_OUTPUT" >> $GITHUB_OUTPUT

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewPath = '${{ steps.claude_review.outputs.review_file }}';

            if (!fs.existsSync(reviewPath)) {
              console.log('Review file not found, skipping comment.');
              return;
            }

            const reviewBody = fs.readFileSync(reviewPath, 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reviewBody
            });

      - name: Add review labels based on confidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewPath = '${{ steps.claude_review.outputs.review_file }}';

            if (!fs.existsSync(reviewPath)) {
              return;
            }

            const reviewBody = fs.readFileSync(reviewPath, 'utf8');

            if (reviewBody.includes('**Confidence:** Low') || reviewBody.includes('**Confidence:** Medium')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-review']
              });
            }
