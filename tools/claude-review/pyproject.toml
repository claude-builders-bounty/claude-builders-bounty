[project]
name = "claude-review"
version = "1.0.0"
description = "Claude Code PR reviewer sub-agent"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
claude-review = "claude_review:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
