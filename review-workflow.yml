name: claude-review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install claude-review
        run: |
          pip install urllib3
          curl -fsSL -o /usr/local/bin/claude-review \
            https://raw.githubusercontent.com/AutoJet/claude-review/main/claude-review.py
          chmod +x /usr/local/bin/claude-review

      - name: Run claude-review on the PR
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          /usr/local/bin/claude-review --pr "$PR_URL" \
            --post --token "$GH_TOKEN" --out review.md
          echo "review_posted=true" >> "$GITHUB_OUTPUT"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-review
          path: review.md
