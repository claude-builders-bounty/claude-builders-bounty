<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title & Status Header -->
  <rect x="25" y="20" width="1050" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="55" cy="50" r="10" fill="#22c55e" filter="url(#glow)"/>
  <text x="80" y="55" fill="#f8fafc" font-size="18" font-weight="600">n8n Execution #10892: Success</text>
  <text x="760" y="55" fill="#94a3b8" font-size="14">Trigger: Friday 17:00 UTC | Duration: 2.4s | Status: 200 OK</text>

  <!-- Connecting Execution Lines -->
  <path d="M 170 190 L 250 190" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4"/>
  <path d="M 400 190 L 460 190" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 610 190 L 670 190" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 820 190 L 880 190" stroke="#38bdf8" stroke-width="3"/>

  <!-- Step 1: Cron Trigger -->
  <g transform="translate(40, 130)">
    <rect width="130" height="120" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#0284c7"/>
    <text x="31" y="37" fill="#fff" font-size="16" text-anchor="middle">⏰</text>
    <text x="15" y="70" fill="#f8fafc" font-size="13" font-weight="600">Cron Trigger</text>
    <text x="15" y="90" fill="#38bdf8" font-size="11">0 17 * * 5</text>
    <circle cx="115" cy="25" r="5" fill="#22c55e"/>
  </g>

  <!-- Step 2: Config & Date Engine -->
  <g transform="translate(250, 130)">
    <rect width="150" height="120" rx="12" fill="url(#cardGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#475569"/>
    <text x="31" y="37" fill="#fff" font-size="16" text-anchor="middle">⚙️</text>
    <text x="15" y="70" fill="#f8fafc" font-size="13" font-weight="600">Config &amp; Dates</text>
    <text x="15" y="90" fill="#94a3b8" font-size="11">7-Day Window</text>
    <text x="15" y="105" fill="#94a3b8" font-size="11">EN / FR Logic</text>
    <circle cx="135" cy="25" r="5" fill="#22c55e"/>
  </g>

  <!-- Step 3: GitHub Parallel Fetch -->
  <g transform="translate(460, 130)">
    <rect width="150" height="120" rx="12" fill="url(#cardGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#24292f"/>
    <text x="31" y="37" fill="#fff" font-size="16" text-anchor="middle">🐙</text>
    <text x="15" y="70" fill="#f8fafc" font-size="13" font-weight="600">GitHub API</text>
    <text x="15" y="90" fill="#22c55e" font-size="11">42 Commits</text>
    <text x="15" y="105" fill="#22c55e" font-size="11">8 PRs, 5 Issues</text>
    <circle cx="135" cy="25" r="5" fill="#22c55e"/>
  </g>

  <!-- Step 4: Claude Sonnet 4 -->
  <g transform="translate(670, 130)">
    <rect width="150" height="120" rx="12" fill="url(#cardGrad)" stroke="#d97706" stroke-width="2"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#d97706"/>
    <text x="31" y="37" fill="#fff" font-size="16" text-anchor="middle">🧠</text>
    <text x="15" y="70" fill="#f8fafc" font-size="13" font-weight="600">Claude API</text>
    <text x="15" y="90" fill="#fbbf24" font-size="11">sonnet-4-20250514</text>
    <text x="15" y="105" fill="#94a3b8" font-size="11">Tokens: 642</text>
    <circle cx="135" cy="25" r="5" fill="#22c55e"/>
  </g>

  <!-- Step 5: Webhook Dispatch -->
  <g transform="translate(880, 130)">
    <rect width="150" height="120" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="2"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="#15803d"/>
    <text x="31" y="37" fill="#fff" font-size="16" text-anchor="middle">🚀</text>
    <text x="15" y="70" fill="#f8fafc" font-size="13" font-weight="600">Webhook Post</text>
    <text x="15" y="90" fill="#4ade80" font-size="11">Discord / Slack</text>
    <text x="15" y="105" fill="#94a3b8" font-size="11">HTTP 204 No Content</text>
    <circle cx="135" cy="25" r="5" fill="#22c55e"/>
  </g>

  <!-- Bottom Panel: Execution Log & Output Preview -->
  <rect x="25" y="280" width="1050" height="175" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="50" y="315" fill="#38bdf8" font-size="14" font-weight="600">Node Output Preview: [Claude API &gt; Format Webhook Payload]</text>
  
  <rect x="50" y="330" width="1000" height="105" rx="8" fill="#020617" stroke="#1e293b"/>
  <text x="70" y="355" fill="#a7f3d0" font-family="monospace" font-size="12">🌟 Weekly Highlights: Shipped 8 PRs across runtime hydration, memory leak mitigation, and router stability.</text>
  <text x="70" y="375" fill="#94a3b8" font-family="monospace" font-size="12">🚀 Features: New async streaming engine, zero-allocation parser optimizations, and enhanced CLI telemetry.</text>
  <text x="70" y="395" fill="#94a3b8" font-family="monospace" font-size="12">🐛 Fixes: Resolved 5 issues including race conditions during socket reconnections (#482, #489).</text>
  <text x="70" y="415" fill="#38bdf8" font-family="monospace" font-size="12">👥 Contributors: 14 engineers contributed across 42 commits. Velocity up +18% vs prior cycle.</text>
</svg>
