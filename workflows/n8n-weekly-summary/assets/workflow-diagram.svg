<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f7ff"/>
      <stop offset="100%" style="stop-color:#f0edff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)" stroke="#e5e1ff" stroke-width="1"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b4b">📊 Weekly Dev Summary — n8n Workflow Topology</text>
  <text x="600" y="60" text-anchor="middle" font-size="12" fill="#6b7280">14 nodes • Cron → GitHub API → Claude AI → Multi-channel delivery</text>

  <!-- === NODES === -->
  <!-- 1. Schedule Trigger -->
  <rect x="30" y="250" width="140" height="56" rx="12" fill="#10b981" filter="url(#shadow)"/>
  <text x="100" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">⏰ Weekly Schedule</text>
  <text x="100" y="293" text-anchor="middle" font-size="9" fill="#d1fae5">Cron: Fri 17:00</text>

  <!-- 2. Set Config -->
  <rect x="210" y="250" width="130" height="56" rx="12" fill="#6366f1" filter="url(#shadow)"/>
  <text x="275" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">⚙️ Set Config</text>
  <text x="275" y="293" text-anchor="middle" font-size="9" fill="#e0e7ff">Repo, Lang, Method</text>

  <!-- 3. Calculate Dates -->
  <rect x="380" y="250" width="130" height="56" rx="12" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="445" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">📅 Calc Dates</text>
  <text x="445" y="293" text-anchor="middle" font-size="9" fill="#ede9fe">7-day lookback</text>

  <!-- 4. Fetch Commits -->
  <rect x="555" y="140" width="130" height="56" rx="12" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="620" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">📝 Commits</text>
  <text x="620" y="183" text-anchor="middle" font-size="9" fill="#fef3c7">GitHub API</text>

  <!-- 5. Fetch Issues -->
  <rect x="555" y="250" width="130" height="56" rx="12" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="620" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">🐛 Issues</text>
  <text x="620" y="293" text-anchor="middle" font-size="9" fill="#fef3c7">GitHub API</text>

  <!-- 6. Fetch PRs -->
  <rect x="555" y="360" width="130" height="56" rx="12" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="620" y="385" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">🔀 Merged PRs</text>
  <text x="620" y="403" text-anchor="middle" font-size="9" fill="#fef3c7">GitHub API</text>

  <!-- 7. Aggregate -->
  <rect x="730" y="250" width="130" height="56" rx="12" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="795" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">🔗 Aggregate</text>
  <text x="795" y="293" text-anchor="middle" font-size="9" fill="#ede9fe">Merge + Stats</text>

  <!-- 8. Claude API -->
  <rect x="730" y="140" width="150" height="56" rx="12" fill="#ef4444" filter="url(#shadow)"/>
  <text x="805" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">🤖 Claude API</text>
  <text x="805" y="183" text-anchor="middle" font-size="9" fill="#fee2e2">claude-sonnet-4-20250514</text>

  <!-- 9. Extract Summary -->
  <rect x="920" y="140" width="130" height="56" rx="12" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="985" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">📤 Extract</text>
  <text x="985" y="183" text-anchor="middle" font-size="9" fill="#ede9fe">Parse Response</text>

  <!-- 10. Router -->
  <rect x="920" y="250" width="130" height="56" rx="12" fill="#6366f1" filter="url(#shadow)"/>
  <text x="985" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">🔀 Router</text>
  <text x="985" y="293" text-anchor="middle" font-size="9" fill="#e0e7ff">Switch delivery</text>

  <!-- 11. Discord -->
  <rect x="1080" y="160" width="100" height="48" rx="10" fill="#5865f2" filter="url(#shadow)"/>
  <text x="1130" y="189" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">💬 Discord</text>

  <!-- 12. Slack -->
  <rect x="1080" y="250" width="100" height="48" rx="10" fill="#e01e5a" filter="url(#shadow)"/>
  <text x="1130" y="279" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">💬 Slack</text>

  <!-- 13. Email -->
  <rect x="1080" y="340" width="100" height="48" rx="10" fill="#0891b2" filter="url(#shadow)"/>
  <text x="1130" y="369" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">📧 Email</text>

  <!-- 14. Error Handler -->
  <rect x="730" y="370" width="130" height="48" rx="12" fill="#dc2626" filter="url(#shadow)" opacity="0.85"/>
  <text x="795" y="399" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">⚠️ Error Handler</text>

  <!-- === CONNECTIONS === -->
  <!-- Schedule -> Config -->
  <line x1="170" y1="278" x2="210" y2="278" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Config -> Dates -->
  <line x1="340" y1="278" x2="380" y2="278" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Dates -> Commits -->
  <path d="M510,260 Q532,168 555,168" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Dates -> Issues -->
  <line x1="510" y1="278" x2="555" y2="278" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Dates -> PRs -->
  <path d="M510,295 Q532,388 555,388" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Commits -> Aggregate -->
  <path d="M685,168 Q707,278 730,278" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Issues -> Aggregate -->
  <line x1="685" y1="278" x2="730" y2="278" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- PRs -> Aggregate -->
  <path d="M685,388 Q707,278 730,278" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Aggregate -> Claude -->
  <path d="M795,250 L795,196" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Claude -> Extract -->
  <line x1="880" y1="168" x2="920" y2="168" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Extract -> Router -->
  <path d="M985,196 L985,250" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Router -> Discord -->
  <path d="M1050,265 Q1065,184 1080,184" stroke="#5865f2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Router -> Slack -->
  <line x1="1050" y1="278" x2="1080" y2="274" stroke="#e01e5a" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Router -> Email -->
  <path d="M1050,295 Q1065,364 1080,364" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Error -> Router (dashed) -->
  <path d="M860,394 Q930,394 950,306" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="480" width="1140" height="100" rx="10" fill="#fff" fill-opacity="0.7" stroke="#e5e7eb"/>
  <text x="50" y="502" font-size="12" font-weight="700" fill="#374151">Legend</text>
  <rect x="50" y="512" width="14" height="14" rx="3" fill="#10b981"/>
  <text x="70" y="523" font-size="10" fill="#4b5563">Trigger</text>
  <rect x="140" y="512" width="14" height="14" rx="3" fill="#6366f1"/>
  <text x="160" y="523" font-size="10" fill="#4b5563">Config / Logic</text>
  <rect x="270" y="512" width="14" height="14" rx="3" fill="#8b5cf6"/>
  <text x="290" y="523" font-size="10" fill="#4b5563">Code / Transform</text>
  <rect x="420" y="512" width="14" height="14" rx="3" fill="#f59e0b"/>
  <text x="440" y="523" font-size="10" fill="#4b5563">GitHub API</text>
  <rect x="540" y="512" width="14" height="14" rx="3" fill="#ef4444"/>
  <text x="560" y="523" font-size="10" fill="#4b5563">Claude AI</text>
  <rect x="640" y="512" width="14" height="14" rx="3" fill="#5865f2"/>
  <text x="660" y="523" font-size="10" fill="#4b5563">Delivery</text>
  <rect x="740" y="512" width="14" height="14" rx="3" fill="#dc2626"/>
  <text x="760" y="523" font-size="10" fill="#4b5563">Error Handling</text>

  <text x="50" y="555" font-size="10" fill="#6b7280">⚙️ Configurable: GITHUB_OWNER, GITHUB_REPO, SUMMARY_LANGUAGE (EN/FR/ZH), DELIVERY_METHOD (discord/slack/email)</text>
  <text x="50" y="570" font-size="10" fill="#6b7280">🔑 Credentials: GitHub Token (Header Auth), Anthropic API Key (Header Auth), SMTP (optional), Webhook URLs (variables)</text>
</svg>
