<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="500" fill="url(#bg)" rx="16" />

  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4">
    <line x1="50" y1="100" x2="1150" y2="100" />
    <line x1="50" y1="200" x2="1150" y2="200" />
    <line x1="50" y1="300" x2="1150" y2="300" />
    <line x1="50" y1="400" x2="1150" y2="400" />
  </g>

  <!-- Title Header -->
  <text x="60" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">n8n Execution Status: Weekly Dev Summary with Claude Sonnet 4</text>
  <rect x="940" y="32" width="180" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
  <circle cx="960" cy="48" r="6" fill="#10b981" />
  <text x="975" y="53" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="600">EXECUTION: SUCCESS</text>

  <!-- Flow Arrows / Connections -->
  <g stroke="#10b981" stroke-width="2.5" fill="none">
    <path d="M 180 250 L 260 250" />
    <path d="M 380 250 L 460 250" />
    <path d="M 580 250 C 620 250, 620 160, 660 160" />
    <path d="M 580 250 L 660 250" />
    <path d="M 580 250 C 620 250, 620 340, 660 340" />
    <path d="M 780 160 C 820 160, 820 250, 860 250" />
    <path d="M 780 250 L 860 250" />
    <path d="M 780 340 C 820 340, 820 250, 860 250" />
    <path d="M 980 250 L 1020 250" />
  </g>

  <!-- Node 1: Schedule Trigger -->
  <g transform="translate(60, 210)" filter="url(#shadow)">
    <rect width="120" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="25" cy="40" r="12" fill="#3b82f6" />
    <text x="45" y="38" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Weekly Cron</text>
    <text x="45" y="54" fill="#94a3b8" font-family="sans-serif" font-size="10">Fri 17:00 UTC</text>
  </g>

  <!-- Node 2: Config Variables -->
  <g transform="translate(260, 210)" filter="url(#shadow)">
    <rect width="120" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="25" cy="40" r="12" fill="#8b5cf6" />
    <text x="45" y="38" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Config Vars</text>
    <text x="45" y="54" fill="#94a3b8" font-family="sans-serif" font-size="10">Repo, Lang, Hook</text>
  </g>

  <!-- Node 3: Date Window -->
  <g transform="translate(460, 210)" filter="url(#shadow)">
    <rect width="120" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="25" cy="40" r="12" fill="#f59e0b" />
    <text x="45" y="38" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Date Window</text>
    <text x="45" y="54" fill="#94a3b8" font-family="sans-serif" font-size="10">Rolling 7-Days</text>
  </g>

  <!-- Parallel Branch Nodes -->
  <!-- Node 4: Commits -->
  <g transform="translate(660, 120)" filter="url(#shadow)">
    <rect width="120" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="15" y="32" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Weekly Commits</text>
    <text x="15" y="48" fill="#10b981" font-family="sans-serif" font-size="10">200 OK (38 items)</text>
  </g>

  <!-- Node 5: Issues -->
  <g transform="translate(660, 215)" filter="url(#shadow)">
    <rect width="120" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="15" y="32" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Closed Issues</text>
    <text x="15" y="48" fill="#10b981" font-family="sans-serif" font-size="10">200 OK (12 items)</text>
  </g>

  <!-- Node 6: Merged PRs -->
  <g transform="translate(660, 310)" filter="url(#shadow)">
    <rect width="120" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="15" y="32" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Merged PRs</text>
    <text x="15" y="48" fill="#10b981" font-family="sans-serif" font-size="10">200 OK (8 items)</text>
  </g>

  <!-- Node 7: Claude Sonnet 4 -->
  <g transform="translate(860, 210)" filter="url(#shadow)">
    <rect width="120" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="25" cy="40" r="12" fill="#ec4899" />
    <text x="45" y="38" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Claude Sonnet</text>
    <text x="45" y="54" fill="#94a3b8" font-family="sans-serif" font-size="10">sonnet-4 (1.5k tok)</text>
  </g>

  <!-- Node 8: Deliver Multi-Channel -->
  <g transform="translate(1020, 210)" filter="url(#shadow)">
    <rect width="130" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="25" cy="40" r="12" fill="#6366f1" />
    <text x="45" y="38" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Webhook Relay</text>
    <text x="45" y="54" fill="#10b981" font-family="sans-serif" font-size="10">Discord / Slack 204</text>
  </g>
</svg>
