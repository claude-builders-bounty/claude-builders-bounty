<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 8px; }
      .success { stroke: #22c55e; stroke-width: 2.5; }
      .badge { fill: #22c55e; rx: 4px; }
      .text-title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; }
      .text-sub { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .text-badge { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; }
      .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" class="bg" />

  <!-- Title bar -->
  <text x="30" y="40" fill="#f8fafc" font-family="system-ui" font-size="18" font-weight="700">n8n Execution Canvas: Weekly GitHub Dev Summary with Claude API</text>
  <rect x="780" y="24" width="180" height="26" class="badge" fill="#22c55e" />
  <text x="800" y="42" class="text-badge" fill="#ffffff" font-size="13">SUCCESS (200 OK)</text>

  <!-- Node 1: Trigger -->
  <rect x="40" y="90" width="180" height="90" class="card success" />
  <text x="55" y="125" class="text-title">Cron Schedule</text>
  <text x="55" y="148" class="text-sub">Every Fri at 5:00 PM</text>
  <circle cx="200" cy="110" r="6" fill="#22c55e" />

  <!-- Arrow 1 -> 2 -->
  <line x1="220" y1="135" x2="265" y2="135" class="arrow" />

  <!-- Node 2: GitHub Ingestion -->
  <rect x="275" y="90" width="190" height="90" class="card success" />
  <text x="290" y="125" class="text-title">GitHub API</text>
  <text x="290" y="148" class="text-sub">Commits, PRs, Issues</text>
  <circle cx="445" cy="110" r="6" fill="#22c55e" />

  <!-- Arrow 2 -> 3 -->
  <line x1="465" y1="135" x2="510" y2="135" class="arrow" />

  <!-- Node 3: Claude API -->
  <rect x="520" y="90" width="200" height="90" class="card success" />
  <text x="535" y="125" class="text-title">Claude API</text>
  <text x="535" y="148" class="text-sub">claude-sonnet-4</text>
  <circle cx="700" cy="110" r="6" fill="#22c55e" />

  <!-- Arrow 3 -> 4 -->
  <line x1="720" y1="135" x2="765" y2="135" class="arrow" />

  <!-- Node 4: Webhook Dispatch -->
  <rect x="775" y="90" width="185" height="90" class="card success" />
  <text x="790" y="125" class="text-title">Discord/Slack</text>
  <text x="790" y="148" class="text-sub">Webhook Delivered</text>
  <circle cx="940" cy="110" r="6" fill="#22c55e" />

  <!-- Console Log Panel -->
  <rect x="40" y="210" width="920" height="80" rx="6" fill="#020617" stroke="#1e293b" />
  <text x="55" y="235" fill="#38bdf8" font-family="monospace" font-size="12">[2026-10-25 17:00:01] Workflow execution #8472 triggered by cron.</text>
  <text x="55" y="255" fill="#4ade80" font-family="monospace" font-size="12">[2026-10-25 17:00:03] Fetched 28 commits, 4 merged PRs. Prompted Claude API (claude-sonnet-4-20250514).</text>
  <text x="55" y="275" fill="#a855f7" font-family="monospace" font-size="12">[2026-10-25 17:00:06] Summary generated (1,240 tokens). Dispatched payload to Discord webhook (204 No Content).</text>
</svg>
