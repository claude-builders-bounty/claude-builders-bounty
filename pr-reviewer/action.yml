name: 'Claude PR Reviewer'
description: 'Uses Claude to review a PR and post a structured comment'
inputs:
  github_token:
    description: 'GitHub token to fetch PR diff and post comment'
    required: true
    default: ${{ github.token }}
  anthropic_api_key:
    description: 'Anthropic API key'
    required: true
  pr_url:
    description: 'URL of the PR to review'
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      shell: bash
      run: pip install requests anthropic
    - name: Run Claude Review
      id: review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        # Run the Python script from the action path
        python ${{ github.action_path }}/claude-review.py --pr ${{ inputs.pr_url }} > review_output.md
    - name: Post Comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        gh pr comment ${{ inputs.pr_url }} --body-file review_output.md
