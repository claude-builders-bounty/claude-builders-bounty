name: "PR Review"
description: "Post a structured review comment on a PR using claude-review"
inputs:
  pr-url:
    description: "Full PR URL, e.g. https://github.com/owner/repo/pull/123"
    required: true
  depth:
    description: "Review depth: quick, standard, deep"
    required: false
    default: "standard"
  format:
    description: "Output format: md or json"
    required: false
    default: "md"
runs:
  using: "composite"
  steps:
    - name: Review PR
      id: review
      shell: bash
      run: |
        "${{ github.action_path }}/claude-review" --pr "${{ inputs.pr-url }}" --depth "${{ inputs.depth }}" --format "${{ inputs.format }}" > review.md
        cat review.md
        PR="${{ inputs.pr-url }}"
        OWNER=$(echo "$PR" | cut -d/ -f4)
        REPO=$(echo "$PR" | cut -d/ -f5)
        NUM=$(echo "$PR" | cut -d/ -f7)
        echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
        echo "repo=$REPO" >> "$GITHUB_OUTPUT"
        echo "num=$NUM" >> "$GITHUB_OUTPUT"
    - name: Comment review
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          github.rest.issues.createComment({
            owner: '${{ steps.review.outputs.owner }}',
            repo: '${{ steps.review.outputs.repo }}',
            issue_number: Number('${{ steps.review.outputs.num }}'),
            body: fs.readFileSync('review.md', 'utf8'),
          });
