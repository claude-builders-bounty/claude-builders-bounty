name: 'Claude PR Reviewer'
description: 'Automatically review pull requests using Claude Code'
inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  pr-number:
    description: 'PR number to review'
    required: true
  owner:
    description: 'Repository owner'
    required: true
  repo:
    description: 'Repository name'
    required: true
  comment:
    description: 'Whether to post review as PR comment'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Run Claude Review
      shell: bash
      run: |
        python3 -m pip install --quiet requests urllib3
        python3 ${{ github.action_path }}/claude-review.py \
          --pr "${{ inputs.owner }}/${{ inputs.repo }}/${{ inputs.pr-number }}" \
          --token "${{ inputs.github-token }}" \
          --output review.md
    
    - name: Post Review Comment
      if: inputs.comment == 'true'
      shell: bash
      run: |
        REVIEW=$(cat review.md)
        gh pr comment ${{ inputs.pr-number }} --repo ${{ inputs.owner }}/${{ inputs.repo }} --body "$REVIEW"
      env:
        GH_TOKEN: ${{ inputs.github-token }}
branding:
  icon: 'check-circle'
  color: 'blue'
