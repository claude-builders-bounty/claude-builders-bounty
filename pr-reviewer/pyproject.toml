[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-review"
version = "0.1.0"
description = "A Claude-powered CLI to review GitHub PRs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "anthropic"
]

[project.scripts]
claude-review = "claude_review:main"
