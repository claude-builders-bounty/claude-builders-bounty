# Copy to .github/workflows/claude-review.yml and add the ANTHROPIC_API_KEY repo secret.
# Note: PRs from forks do not get access to secrets, so they will not be reviewed.
name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Review PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 pr-reviewer/claude-review --pr "$PR_URL" --post
