name: PR Review (claude-review)

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # The claude-review tool files must exist in this repo: copy the whole
      # project (bin/, package.json, README.md) alongside this workflow, or
      # check out this project into bin/. The guard below fails clearly if not.
      - uses: actions/checkout@v4

      - name: Verify tool is present
        run: |
          if [ -f bin/claude-review.mjs ]; then exit 0; fi
          echo "::error::claude-review tool not found at bin/claude-review.mjs — copy the claude-review project into this repo next to this workflow."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Optional: the Claude Code CLI powers the LLM engine. If it (or
      # ANTHROPIC_API_KEY) is unavailable, the tool falls back to its built-in
      # zero-dependency heuristic analyzer and still posts a review.
      - name: Install Claude Code (optional)
        run: npm install -g @anthropic-ai/claude-code || echo "::warning::Claude Code CLI unavailable; heuristic fallback will be used"

      - name: Review PR and post structured comment
        run: node bin/claude-review.mjs --pr "$PR_URL" --comment
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
