name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run PR Review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "### 🔍 AI-Powered PR Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 pr-reviewer.py "https://github.com/${{ github.repository }}/pull/${{ github.event.number }}" >> $GITHUB_STEP_SUMMARY
