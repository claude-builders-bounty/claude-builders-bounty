# .github/workflows/pr-review.yml
# GitHub Action: Auto-review PRs with Claude Code AI agent
#
# Triggers on: PR opened, reopened, synchronize (new commits)
# Posts a structured review comment on the PR

name: "AI PR Review"

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Only run on PRs, not regular issues
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install claude-review
        run: |
          curl -sSfL https://raw.githubusercontent.com/claude-builders-bounty/claude-builders-bounty/main/claude-review -o /usr/local/bin/claude-review
          chmod +x /usr/local/bin/claude-review

      - name: Run AI Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          if [ -z "$PR_URL" ]; then
            # Triggered via comment — extract PR URL from issue
            PR_URL="${{ github.event.issue.pull_request.html_url }}"
          fi
          claude-review --pr "$PR_URL" --output review.md || echo "Review failed — check API key"

      - name: Post Review Comment
        if: hashFiles('review.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');
            const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: review
            });
